# CI du repo EXAUCE — doc 11 §4 (lint, tests, contrat, sécurité, build).
#
# - backend : ruff (format + lint), mypy, validation du contrat, migration
#   Alembic + seed + pytest complet contre PostgreSQL et MailHog éphémères ;
# - front/backoffice : npm ci, eslint, vitest, build TypeScript/Vite ;
# - sécurité : pip-audit (bloquant) et npm audit (signalé, non bloquant :
#   les correctifs des 16 vulns actuels demandent des montées majeures) ;
# - docker : build de l'image Backend (contexte = racine du repo).

name: CI

on:
  push:
    branches: [backend/main, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, contrat, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      EXAUCE_ENV: test
      EXAUCE_SECRET_KEY: ci-only-insecure-secret-change-me-0123456789
      EXAUCE_DATABASE_URL: postgresql+asyncpg://exauce:exauce@localhost:5432/exauce
      EXAUCE_MAILHOG_HOST: localhost
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: exauce
          POSTGRES_USER: exauce
          POSTGRES_PASSWORD: exauce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exauce -d exauce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/pyproject.toml

      - name: Installer les dépendances
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install openapi-spec-validator

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Contrat OpenAPI valide
        run: python -m openapi_spec_validator ../Analyse/modelisation/docs/openapi.yaml

      - name: Migration + seed
        run: |
          python -m alembic upgrade head
          python -m app.cli.seed --with-demo

      - name: Tests (pytest)
        run: python -m pytest

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build

  backoffice:
    name: Backoffice (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backoffice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Backoffice/package-lock.json

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build

  security:
    name: Sécurité (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/pyproject.toml

      - name: pip-audit (bloquant)
        working-directory: Backend
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" pip-audit
          python -m pip_audit

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Non bloquant : les 16 vulns actuelles (2 critical, 2 high) se corrigent
      # par des montées majeures (vitest 5, vite 8, zod 4) — décision à trancher.
      # Le job reste visible dans l'onglet Actions.
      - name: npm audit (signalé, non bloquant)
        working-directory: Frontend
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

      - name: npm audit backoffice (signalé, non bloquant)
        working-directory: Backoffice
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  docker:
    name: Build image Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (contexte = racine du repo)
        run: docker build -f Backend/Dockerfile -t exauce-backend:${{ github.sha }} .
