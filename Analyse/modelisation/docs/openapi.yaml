openapi: 3.1.0
info:
  title: EXAUCE Backend — Contrat API v1
  version: 1.0.0-M3.2
  description: |
    Contrat d'API de référence pour le Backend (FastAPI + PostgreSQL) d'EXAUCE
    Audit & Conseils SAS.
    Trois surfaces : public (`/api/v1`), espace client (`/api/v1/client`),
    back-office (`/api/v1/admin`).
    Chaque réponse de contenu est mono-langue avec repli explicite (`is_fallback`).

    **Noms figés — session et CSRF (ADR-004 / ADR-009, page 09).**
    Le Backend et le Back-office n'utilisent que ces identifiants :

    | Canal | Nom | Attributs |
    |---|---|---|
    | Cookie de session | `session_id` | HttpOnly, Secure (prod), SameSite=Lax, Domain `.exauceac.com` (prod) |
    | Cookie CSRF | `csrf_token` | **non-HttpOnly** (lisible JS), Secure (prod), SameSite=Lax, Domain `.exauceac.com` (prod) |
    | En-tête CSRF | `X-CSRF-Token` | obligatoire sur toute mutation (`POST`/`PUT`/`PATCH`/`DELETE`) de `/admin/**` hors login, forgot, reset, activate |

    Le jeton CSRF est émis au login réussi (`status=authenticated`), à l'activation,
    et renvoyé par `GET /admin/auth/me`. Le client recopie le cookie `csrf_token`
    dans l'en-tête `X-CSRF-Token`. Écarts d'en-tête : `403` `CSRF_TOKEN_MISSING`
    ou `CSRF_TOKEN_MISMATCH`.

    Mot de passe : Argon2id, **longueur minimale 14** (page 09). Aucun jeton
    d'accès n'est renvoyé dans le corps JSON (pas de Bearer, pas de localStorage).
  contact:
    name: Projet EXAUCE
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Serveur API v1
tags:
  - name: public-content
    description: Consultation publique du contenu du site (services, pages, secteurs, publications)
  - name: public-search
    description: Recherche plein texte
  - name: public-contact
    description: Formulaire de contact et capture de leads
  - name: client
    description: Espace client (v2)
  - name: admin-auth
    description: Authentification back-office (session cookie + CSRF)
  - name: admin-reports
    description: Tableau de bord et agrégats
  - name: admin-publication
    description: Jobs de publication SSG et flux SSE
  - name: admin-notifications
    description: Notifications in-app (leads)
  - name: admin-search
    description: Recherche back-office — à venir (501)
  - name: admin-content
    description: Gestion éditoriale des services et publications
  - name: admin-pages
    description: Gestion des pages et des sections typées
  - name: admin-media
    description: Médiathèque
  - name: admin-settings
    description: Paramètres du site et SEO
  - name: admin-leads
    description: Gestion des demandes de contact
  - name: admin-users
    description: Gestion des utilisateurs et rôles
  - name: admin-audit
    description: Journal d'audit et conformité
  - name: infra
    description: Healthcheck et supervision (hors contrat applicatif)

paths:
  # =========================================================================
  # 1. SURFACES PUBLIQUES
  # =========================================================================

  /health:
    get:
      operationId: getHealth
      tags: [infra]
      summary: Santé de l'API (healthcheck Docker, supervision)
      description: |
        Endpoint d'infrastructure. Ne dépend pas de la base : sert à la
        healthcheck Compose et à la supervision. Exclu du fuzzing de contrat
        (lignes de base de Schemathesis).
      responses:
        '200':
          description: Processus vivant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}

  /services-tree:
    get:
      operationId: getServicesTree
      tags: [public-content]
      summary: Arbre complet des services (4 niveaux) dans la langue demandée
      parameters:
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Arbre publié (ou repli explicite)
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServicesTree'}
        '304': {description: 'Non modifié (ETag)'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /familles/{slug}:
    get:
      operationId: getFamily
      tags: [public-content]
      summary: Détail d'une famille de services avec liste de ses domaines
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]+$'}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Famille publiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Family'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /domains/{slug}:
    get:
      operationId: getDomain
      tags: [public-content]
      summary: Détail d'un domaine avec groupes et prestations (EF-102)
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]+$'}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Domaine publié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainDetail'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /sectors:
    get:
      operationId: listSectors
      tags: [public-content]
      summary: Univers et sous-catégories de clientèle (EF-104)
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Liste des secteurs approuvés
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Sector'}

  /intervention-types:
    get:
      operationId: listInterventionTypes
      tags: [public-content]
      summary: Types d'intervention (récurrentes et ponctuelles - EF-103)
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Types d'intervention
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InterventionType'}

  /offices:
    get:
      operationId: listOffices
      tags: [public-content]
      summary: Bureaux et implantations du cabinet (EF-106)
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Liste des bureaux actifs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Office'}

  /team:
    get:
      operationId: listTeam
      tags: [public-content]
      summary: Équipe et fondateur (EF-107)
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Membres de l'équipe
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TeamMember'}

  /publications:
    get:
      operationId: listPublications
      tags: [public-content]
      summary: Publications publiées (paginées au curseur - EF-105)
      parameters:
        - $ref: '#/components/parameters/lang'
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
        - name: category
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Liste publiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PublicationSummary'}
                  next_cursor: {type: string, nullable: true}

  /publications/{slug}:
    get:
      operationId: getPublication
      tags: [public-content]
      summary: Détail d'une publication publiée (EF-105)
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]+$'}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Publication publiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationDetail'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /pages/{key}:
    get:
      operationId: getPage
      tags: [public-content]
      summary: Page éditoriale avec ses sections typées (EF-107, EF-108)
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Page et ses sections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /partners:
    get:
      operationId: listPartners
      tags: [public-content]
      summary: Partenaires actifs, dans l'ordre d'affichage
      description: |
        Alimente le bloc « partenaires » de l'accueil. Seuls les partenaires
        actifs sont renvoyés, triés par `position`. Réponse mono-langue avec
        repli explicite (`is_fallback`) comme les autres contenus publics.
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Partenaires actifs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartnerList'}

  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [public-content]
      summary: Coordonnées, identité et SEO publics (EF-106)
      responses:
        '200':
          description: Paramètres publics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSettings'}

  /languages/active:
    get:
      operationId: listActiveLanguages
      tags: [public-content]
      summary: Langues actives pour le sélecteur du frontend (EF-602)
      responses:
        '200':
          description: Langues actives
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Language'}

  /search:
    get:
      operationId: search
      tags: [public-search]
      summary: Recherche plein texte indexée par langue (EF-201..204)
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 120}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/SearchHit'}
                  message: {type: string}

  /contact:
    post:
      operationId: submitContact
      tags: [public-contact]
      summary: Soumission du formulaire de contact (EF-301..303)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactRequest'}
      responses:
        '202':
          description: Demande enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [new]}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
        '429': {$ref: '#/components/responses/Eproblem'}

  /sitemap.xml:
    get:
      operationId: getSitemapXml
      tags: [public-content]
      summary: Sitemap XML dynamique multi-langue (EF-701)
      responses:
        '200':
          description: Flux XML du sitemap
          content:
            application/xml:
              schema: {type: string}

  # =========================================================================
  # 2. ESPACE CLIENT (v2)
  # =========================================================================

  /client/auth/activate:
    post:
      operationId: activateClientAccount
      tags: [client]
      summary: Activation de compte client via invitation signée (EF-401)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, format: password, minLength: 14}
                mfa_activate: {type: boolean, default: false}
      responses:
        '200': {description: 'Compte activé, session créée'}
        '410': {$ref: '#/components/responses/Eproblem'}

  /client/auth/login:
    post:
      operationId: clientLogin
      tags: [client]
      summary: Connexion espace client (EF-402)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                totp_code: {type: string}
      responses:
        '200': {description: 'Session créée ou mfa_required'}
        '401': {$ref: '#/components/responses/Eproblem'}

  /client/documents:
    get:
      operationId: listClientDocuments
      tags: [client]
      summary: Documents du compte client connecté (EF-403)
      responses:
        '200':
          description: Liste des documents
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ClientDocument'}
        '401': {$ref: '#/components/responses/Eproblem'}

  /client/documents/{id}/download:
    get:
      operationId: downloadClientDocument
      tags: [client]
      summary: Téléchargement sécurisé d'un document client (EF-403)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Flux du document
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}

  # =========================================================================
  # 3. BACK-OFFICE (ADMIN)
  # =========================================================================

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Connexion back-office (Argon2id + TOTP, EF-501, ENF-301)
      description: |
        Première étape : e-mail + mot de passe.
        Si le compte a le MFA activé et qu'`totp_code` est absent ou invalide
        après mot de passe correct : `200` avec `status=mfa_required`
        (aucun cookie de session). Le client réessaie avec le même payload
        plus `totp_code`.
        Succès : `200` `status=authenticated`, cookies `session_id` (HttpOnly)
        et `csrf_token` (lisible), corps `{ user, csrf_token }`.
        Identifiants invalides : `401` `UNAUTHENTICATED` (message identique,
        anti-énumération). Trop de tentatives : `429` `RATE_LIMITED` avec
        `Retry-After`. Session idle expirée côté client : redirection login
        après `401` `SESSION_EXPIRED` sur les routes suivantes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminLoginRequest'}
      responses:
        '200':
          description: Session créée ou MFA requis
          headers:
            Set-Cookie:
              description: |
                En cas de `status=authenticated` uniquement :
                `session_id` (HttpOnly) et `csrf_token` (non-HttpOnly).
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLoginResponse'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
        '429':
          description: Verrouillage / rate limit (page 09 §2.2)
          headers:
            Retry-After:
              schema: {type: integer}
              description: Secondes avant nouvel essai
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Déconnexion (révocation de la session courante)
      description: Exige cookie `session_id` et en-tête `X-CSRF-Token`.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '204': {description: 'Session révoquée, cookies effacés'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/me:
    get:
      operationId: adminMe
      tags: [admin-auth]
      summary: Session courante, permissions et jeton CSRF
      security:
        - SessionCookie: []
      description: |
        Source de vérité UI pour le RBAC (masquer n'est pas autoriser).
        Réémet `csrf_token` (cookie + corps) pour les SPA qui relisent
        le cookie après un rechargement.
      responses:
        '200':
          description: Utilisateur authentifié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMeResponse'}
        '401': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/password-forgot:
    post:
      operationId: adminPasswordForgot
      tags: [admin-auth]
      summary: Demande de réinitialisation (lien signé, 1 h, usage unique)
      description: |
        Toujours `202`, même si l'e-mail est inconnu (anti-énumération, page 09).
        Aucun cookie. Le mail n'est envoyé que si le compte existe et est actif.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordForgotRequest'}
      responses:
        '202':
          description: Demande acceptée (aucune indication d'existence du compte)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [accepted]}
        '422': {$ref: '#/components/responses/Eproblem'}
        '429': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/password-reset:
    post:
      operationId: adminPasswordReset
      tags: [admin-auth]
      summary: Pose un nouveau mot de passe via le jeton du lien signé
      description: Révoque les sessions existantes du compte (page 09 §2.2).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordResetRequest'}
      responses:
        '204': {description: Mot de passe mis à jour}
        '410':
          description: Jeton expiré, déjà utilisé ou invalide (`TOKEN_EXPIRED`)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/password-change:
    post:
      operationId: adminPasswordChange
      tags: [admin-auth]
      summary: Changement de mot de passe (session active, dont must_reset_password)
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordChangeRequest'}
      responses:
        '204': {description: Mot de passe mis à jour}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/activate:
    post:
      operationId: adminActivateAccount
      tags: [admin-auth]
      summary: Activation par invitation (fondateur Q-105 et utilisateurs invités)
      description: |
        Compte créé avec `password_hash=NULL` et `must_reset_password=true`.
        Le lien signé (TTL 7 jours, usage unique) permet de définir le mot
        de passe (min. 14). Succès : session + cookies CSRF comme au login.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminActivateRequest'}
      responses:
        '200':
          description: Compte activé, session créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLoginAuthenticated'}
        '410':
          description: Invitation expirée, déjà utilisée ou invalide (`TOKEN_EXPIRED`)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  # ── Authentification : MFA obligatoire, codes de secours, réinitialisation ──
  /admin/auth/mfa/enroll:
    post:
      operationId: adminMfaEnroll
      tags: [admin-auth]
      summary: Démarre l'enrôlement TOTP (secret et URI otpauth)
      description: |
        Premier appel de l'enrôlement. Accepte soit une session active, soit
        l'`enrollment_token` reçu au login avec `status=mfa_enrollment_required`
        (aucun cookie de session dans ce second cas).
        Le secret n'est renvoyé qu'une fois : il n'est pas relisible ensuite.
        Un enrôlement déjà actif est refusé par `409 MFA_ALREADY_ENABLED`.
      security:
        - SessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                enrollment_token:
                  type: string
                  description: Jeton court (5 min, usage unique) du login à MFA obligatoire.
      responses:
        '200':
          description: Secret TOTP à afficher une seule fois
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMfaEnrollment'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '410': {$ref: '#/components/responses/Eproblem'}
        '429': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/mfa/enroll/confirm:
    post:
      operationId: adminMfaEnrollConfirm
      tags: [admin-auth]
      summary: Valide le premier code TOTP et remet les codes de secours
      description: |
        Vérifie `totp_code` contre le secret en cours d'enrôlement, active le MFA
        et génère dix codes de secours à usage unique, affichés une seule fois.
        Si l'appel vient d'un login (`enrollment_token`), la session est créée
        comme dans `POST /admin/auth/login` : cookies `session_id` et
        `csrf_token`, corps enrichi des codes de secours.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code:
                  type: string
                  pattern: '^[0-9]{6}$'
                enrollment_token:
                  type: string
      responses:
        '200':
          description: MFA activé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMfaEnrollmentConfirmed'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '410': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
        '429': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/mfa/recovery-codes:
    post:
      operationId: adminMfaRegenerateRecoveryCodes
      tags: [admin-auth]
      summary: Régénère les codes de secours (mot de passe exigé)
      description: |
        Invalide tous les codes précédents et renvoie dix nouveaux codes à usage
        unique. Le mot de passe courant est exigé : les codes de secours sont
        l'ultime moyen d'accès, la régénération est donc une opération sensible.
        Le MFA doit être actif (`409 MFA_ENROLLMENT_REQUIRED` sinon).
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password, minLength: 1}
      responses:
        '200':
          description: Nouveaux codes de secours
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
        '429': {$ref: '#/components/responses/Eproblem'}

  /admin/users/{id}/mfa/reset:
    post:
      operationId: adminResetUserMfa
      tags: [admin-users]
      summary: Réinitialise le MFA d'un compte (téléphone perdu)
      description: |
        Désactive le secret TOTP, invalide les codes de secours et révoque toutes
        les sessions du compte. Au prochain login, le compte reçoit
        `mfa_enrollment_required` s'il détient un rôle à MFA obligatoire
        (`super_admin`, `admin`, `crm`), sinon un login simple.
        L'auto-réinitialisation est refusée (`403`) : un compte ne peut pas
        lever son propre second facteur.
      security:
        - SessionCookie: []
          CsrfHeader: []
      x-permission: [users, edit, default]
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: 'MFA réinitialisé, sessions révoquées'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /admin/reports/dashboard:
    get:
      operationId: adminDashboard
      tags: [admin-reports]
      summary: Agrégats du tableau de bord (EF-512)
      description: |
        Page d'accueil du back-office, accessible à **tout utilisateur
        authentifié** : l'opération ne déclare volontairement aucune
        `x-permission`. Le filtrage est fait par le serveur, widget par
        widget (`leads:view`, `publications:view`, `pages:view`,
        `settings:view`, `audit:view`) : un agrégat non autorisé est absent
        de la réponse, le client n'a donc rien à masquer lui-même.
        Seule l'absence de session produit un 401.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Agrégats filtrés selon les permissions de la session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDashboard'}
        '401': {$ref: '#/components/responses/Eproblem'}

  /admin/publication-jobs:
    get:
      operationId: adminListPublicationJobs
      tags: [admin-publication]
      summary: Historique des jobs de publication SSG
      x-permission: [pages, view, default]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
        - name: offset
          in: query
          schema: {type: integer, default: 0, minimum: 0}
      responses:
        '200':
          description: Liste paginée (offset, tables d'admin stables)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationJobList'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
    post:
      operationId: adminTriggerPublication
      tags: [admin-publication]
      summary: Déclenche un job de publication (bouton Publier)
      x-permission: [pages, publish, default]
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '202':
          description: Job accepté
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationJob'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409':
          description: Un job `queued` ou `building` existe déjà (`CONFLICT`)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /admin/publication-jobs/current:
    get:
      operationId: adminCurrentPublicationJob
      tags: [admin-publication]
      summary: État courant du site public et dernier/actuel job
      description: |
        Alimente l'indicateur navbar : `up_to_date` | `pending_changes` |
        `building` | `failed`.
      x-permission: [pages, view, default]
      responses:
        '200':
          description: État de publication
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationSiteStatus'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/publication-status:
    get:
      operationId: adminPublicationStatusStream
      tags: [admin-publication]
      summary: Flux SSE des jobs de publication (page 17)
      description: |
        `Content-Type: text/event-stream`. Cookie `session_id` requis.
        GET : pas d'en-tête CSRF.

        Format fil de fer (champs SSE standard) :

        ```
        id: <uuid-job-ou-seq>
        event: publication.job
        data: <JSON PublicationJob>

        event: heartbeat
        data: {"ts":"2026-10-31T19:00:00Z"}
        ```

        `event` vaut `publication.job` (changement d'état) ou `heartbeat`
        (toutes les 15 s, pour garder le proxy). `retry` conseillé : 3000.
        Le JSON `data` d'un `publication.job` valide `PublicationJob`.
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Flux ouvert (trames SSE `event` + `data` JSON)
          content:
            text/event-stream:
              schema:
                type: string
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/notifications:
    get:
      operationId: adminListNotifications
      tags: [admin-notifications]
      summary: Notifications in-app (nouveaux leads)
      x-permission: [leads, view, default]
      parameters:
        - name: unread_only
          in: query
          schema: {type: boolean, default: false}
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminNotificationList'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/notifications/{id}/read:
    post:
      operationId: adminMarkNotificationRead
      tags: [admin-notifications]
      summary: Marque une notification comme lue
      x-permission: [leads, view, default]
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Marquée lue}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /admin/search:
    get:
      operationId: adminSearch
      tags: [admin-search]
      summary: Recherche admin (à venir — non implémenté en v1)
      description: |
        **À venir.** La recherche plein texte du back-office n'est pas
        au périmètre v1. L'UI expose une palette (Ctrl/Cmd+K) limitée aux
        entrées de navigation, plus un état « recherche de contenu bientôt
        disponible ». Cet endpoint est tracé pour ne pas inventer un contrat
        parallèle. Réponse v1 : `200` avec `status=not_implemented` et
        `results: []` (pas de 501, pour rester consommable par le client typé).
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: lang
          in: query
          schema: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Stub v1 — recherche de contenu non disponible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSearchResponse'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/publications:
    get:
      operationId: adminListPublications
      tags: [admin-content]
      summary: Liste paginée des publications, tous statuts (EF-405)
      description: |
        Vue éditoriale des publications (brouillon, en revue, planifiée,
        publiée, archivée) dans une langue donnée. La pagination utilise un
        curseur opaque `next_cursor` pour rester stable quand des éléments
        sont ajoutés en tête de liste.
      x-permission: [publications, view, default]
      security:
        - SessionCookie: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [draft, in_review, scheduled, published, archived]}
        - name: lang
          in: query
          schema: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
      responses:
        '200':
          description: Page de publications
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationList'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
    post:
      operationId: adminCreatePublication
      tags: [admin-content]
      summary: Création d'une publication en brouillon (EF-405)
      description: |
        Crée la publication dans la langue demandée et renvoie son contenu
        complet. L'en-tête `Idempotency-Key` protège des doublons lors d'une
        reprise réseau : une clé déjà utilisée renvoie la publication créée.
      x-permission: [publications, create, default]
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicationCreate'}
      responses:
        '201':
          description: Publication créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationDetail'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  # ── Médias d'une publication (galerie, vidéos, couverture dérivée) ──
  /admin/publications/{id}/media:
    get:
      operationId: adminListPublicationMedia
      tags: [admin-content]
      summary: Médias d'une publication, ordonnés, avec couverture dérivée
      description: |
        Renvoie la galerie complète. `media_count` et `cover_media_id` sont
        **dérivés** de la liste (voir `PublicationMedia`) : le client ne les
        calcule pas et ne les écrit jamais.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [publications, view, default]
      responses:
        '200':
          description: Médias de la publication
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationMediaList'}
        '404': {$ref: '#/components/responses/Eproblem'}
    post:
      operationId: adminAddPublicationMedia
      tags: [admin-content]
      summary: Attache un média à une publication (téléversé ou externe)
      description: |
        `source=upload` exige `media_id` (média de la médiathèque) ;
        `source=external` exige `external_url` (YouTube, Vimeo, CDN) et
        `kind=video`. `alt` et `caption` sont par langue.
        Une `position` déjà prise renvoie `409 POSITION_CONFLICT` ; la couverture
        et `media_count` sont recalculés après l'ajout.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicationMediaUpsert'}
      x-permission: [publications, edit, default]
      responses:
        '201':
          description: Média attaché
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationMedia'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/publications/{id}/media/{media_id}:
    patch:
      operationId: adminUpdatePublicationMedia
      tags: [admin-content]
      summary: Modifie l'ordre, la source ou les textes d'un média de publication
      description: |
        Mise à jour partielle. Changer `position` réordonne la galerie et peut
        changer la couverture dérivée ; un doublon renvoie `409
        POSITION_CONFLICT`. `alt` et `caption` s'écrivent par langue.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: media_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicationMediaUpsert'}
      x-permission: [publications, edit, default]
      responses:
        '200':
          description: Média mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationMedia'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
    delete:
      operationId: adminRemovePublicationMedia
      tags: [admin-content]
      summary: Détache un média d'une publication
      description: |
        Le média lui-même reste dans la médiathèque. La couverture et
        `media_count` sont recalculés ; une publication publiée le reste (la
        republication du site est un job distinct).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: media_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [publications, edit, default]
      responses:
        '204': {description: Média détaché}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}
  /admin/content/tree:
    get:
      operationId: adminGetTree
      tags: [admin-content]
      summary: Arbre des services complet (tous statuts et langues, EF-508)
      parameters:
        - $ref: '#/components/parameters/allLangs'
      x-permission: [tree, view, default]
      responses:
        '200':
          description: Arbre complet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServicesTree'}
    post:
      operationId: adminCreateNode
      tags: [admin-content]
      summary: Création d'un nœud dans l'arborescence (EF-508)
      x-permission: [tree, create, default]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeUpsert'}
      responses:
        '201': {description: 'Nœud créé'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/tree/{id}:
    patch:
      operationId: adminUpdateNode
      tags: [admin-content]
      summary: Activation et position d'un nœud de l'arborescence (EF-508)
      description: |
        `is_active` pilote la visibilité publique du nœud et de sa descendance ;
        `position` fixe son rang dans son parent. Les ancres publiques sont
        dérivées de `source_key` et ne sont jamais modifiables : seule la
        traduction (`title`, `slug`) les fait évoluer.
        Le renommage passe par `PUT /admin/content/node/{id}/translation/{lang}`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                is_active: {type: boolean}
                position: {type: integer, minimum: 0}
      x-permission: [tree, move, default]
      responses:
        '200': {description: 'Nœud mis à jour'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/tree/{id}/move:
    post:
      operationId: adminMoveNode
      tags: [admin-content]
      summary: Déplacement d'un nœud vers un nouveau parent (EF-508)
      x-permission: [tree, move, default]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_parent_id]
              properties:
                new_parent_id: {type: string, format: uuid, nullable: true}
                position: {type: integer}
      responses:
        '200': {description: 'Nœud déplacé'}
        '400': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/content/{type}/{id}/publish:
    post:
      operationId: adminPublishContent
      tags: [admin-content]
      summary: Publication d'un contenu (EF-506)
      x-permission: [content, publish, default]
      parameters:
        - name: type
          in: path
          required: true
          schema: {type: string, enum: [node, page, publication, page_section, office, team_member]}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'Contenu publié'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}

  /admin/content/{type}/{id}/translation/{lang}:
    put:
      operationId: adminPutTranslation
      tags: [admin-content]
      summary: Écriture ou mise à jour d'une traduction avec verrou optimiste (EF-505, EF-601)
      x-permission: [content, edit, lang]
      parameters:
        - name: type
          in: path
          required: true
          schema: {type: string, enum: [node, page, page_section, publication, category, media, setting, sector, interventiontype, office, team_member]}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: lang
          in: path
          required: true
          schema: {type: string, minLength: 2, maxLength: 10}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                slug: {type: string}
                og_media_id: {type: string, format: uuid, nullable: true}
                status: {type: string, enum: [draft, in_review, published]}
                expected_version: {type: integer}
                data:
                  type: object
                  additionalProperties: true
      responses:
        '200': {description: 'Traduction enregistrée'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}

  /admin/content/{type}/{id}/versions:
    get:
      operationId: adminListVersions
      tags: [admin-content]
      summary: Historique des versions et révisions d'une entité (EF-505)
      parameters:
        - name: type
          in: path
          required: true
          schema: {type: string}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/lang'
      x-permission: [content, view, default]
      responses:
        '200':
          description: Liste des révisions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ContentVersion'}

  /admin/content/{type}/{id}/restore/{version_id}:
    post:
      operationId: adminRestoreVersion
      tags: [admin-content]
      summary: Restauration d'une version antérieure (EF-505)
      parameters:
        - name: type
          in: path
          required: true
          schema: {type: string}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: version_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [content, edit, default]
      responses:
        '200': {description: 'Version restaurée avec succès'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/pages:
    get:
      operationId: adminListPages
      tags: [admin-pages]
      summary: Liste des 11 pages éditoriales (EF-501)
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Liste des pages
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PageSummary'}

  /admin/pages/{id}:
    get:
      operationId: adminGetPage
      tags: [admin-pages]
      summary: Détail complet d'une page avec ses sections ordonnées (EF-501)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Détail page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
    patch:
      operationId: adminUpdatePage
      tags: [admin-pages]
      summary: Mise à jour des paramètres de la page (navigation, gabarit, statut)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_in_nav: {type: boolean}
                nav_position: {type: integer, nullable: true}
                status: {type: string}
                banners_pending: {type: boolean}
      x-permission: [pages, edit, default]
      responses:
        '200': {description: 'Page mise à jour'}

  /admin/pages/{id}/content/{lang}:
    put:
      operationId: adminPutPageContent
      tags: [admin-pages]
      summary: Écriture des champs de page pour une langue
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: lang
          in: path
          required: true
          schema: {type: string, enum: [fr, en]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PageContentUpdate'}
      x-permission: [pages, edit, lang]
      responses:
        '200':
          description: Page mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/pages/{id}/seo/{lang}:
    put:
      operationId: adminPutPageSeo
      tags: [admin-pages]
      summary: Écriture des métadonnées SEO d'une langue
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: lang
          in: path
          required: true
          schema: {type: string, enum: [fr, en]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PageSeoUpdate'}
      x-permission: [seo, edit, lang]
      responses:
        '200':
          description: Métadonnées SEO mises à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/pages/{id}/sections:
    post:
      operationId: adminAddSection
      tags: [admin-pages]
      summary: Ajout d'une section typée sur une page
      description: |
        Ajoute un bloc à la position demandée. `revision` est la révision de page
        lue par le client : une valeur périmée renvoie `409 CONFLICT`.
        Un type absent du catalogue renvoie `422 VALIDATION_ERROR`, un type dont
        `editable=false` renvoie `409 SECTION_TYPE_NOT_EDITABLE`.
        La réponse contient la page entière pour conserver `revision` et l'ordre.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SectionUpsert'}
      x-permission: [pages, edit, default]
      responses:
        '201':
          description: Section créée, page renvoyée avec sa nouvelle révision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SectionMutationResult'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/sections/{id}:
    patch:
      operationId: adminUpdateSection
      tags: [admin-pages]
      summary: Structure d'une section (position, activation)
      description: |
        Ne touche pas aux textes : `PUT /admin/sections/{id}/content/{lang}`
        écrit les données d'une langue. `revision` (page) protège l'ordre ;
        `position` doit rester unique dans la page, sinon `409 POSITION_CONFLICT`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                position: {type: integer, minimum: 0}
                is_active: {type: boolean}
                revision: {type: integer, minimum: 0}
      x-permission: [pages, edit, default]
      responses:
        '200':
          description: Section mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SectionMutationResult'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
    delete:
      operationId: adminDeleteSection
      tags: [admin-pages]
      summary: Suppression d'une section
      description: |
        `revision` est obligatoire en paramètre de requête. La suppression d'une
        section d'une page publiée est réservée à `pages:delete` (admin) ; un
        rédacteur reçoit `403 FORBIDDEN`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/revision'
      x-permission: [pages, delete, default]
      responses:
        '204': {description: 'Section supprimée'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}

  /admin/sections/{id}/content/{lang}:
    put:
      operationId: adminPutSectionContent
      tags: [admin-pages]
      summary: Écriture des données d'une section pour une langue
      description: |
        Remplace les valeurs d'une seule langue ; l'autre n'est pas touchée.
        La permission est vérifiée **par langue** : un rédacteur limité au
        français reçoit `403 NOT_PERMITTED_LANG` en écrivant `en`.
        Les règles de validation viennent du catalogue (`GET
        /admin/section-types`) : champ requis, longueur maximale, listes.
        Un refus est `422 VALIDATION_ERROR` avec `errors[].field` en chemin
        pointé (`items.0.label`).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: lang
          in: path
          required: true
          schema: {type: string, enum: [fr, en]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SectionContentUpdate'}
      x-permission: [pages, edit, lang]
      responses:
        '200':
          description: Données enregistrées
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SectionMutationResult'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/section-types:
    get:
      operationId: adminListSectionTypes
      tags: [admin-pages]
      summary: Catalogue des types de section et de leurs schémas (EF-501)
      description: |
        Source unique de vérité des formulaires de section : le client génère
        les champs depuis `fields` et n'a aucun code par type. Le catalogue est
        servi depuis la table `section_types` (seed de 21 codes), pas depuis le
        code applicatif. `editable=false` signale un type hors du périmètre
        d'édition : l'écran l'affiche en repli lecture seule, et une écriture
        renvoie `409 SECTION_TYPE_NOT_EDITABLE`.
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Catalogue des types
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SectionTypeList'}

  # ── Workflow éditorial d'une page ──
  # draft --submit-review--> in_review --approve--> approved --publish--> published
  # in_review --reject--> draft ; archived est terminal (restauration admin).
  # Chaque transition exige `revision` (verrou optimiste) et renvoie la page
  # complète avec sa nouvelle révision.
  /admin/pages/{id}/submit-review:
    post:
      operationId: adminSubmitPageReview
      tags: [admin-pages]
      summary: Soumet la page à relecture (draft → in_review)
      description: |
        Transition `draft → in_review`. `revision` obligatoire : une valeur
        périmée renvoie `409 CONFLICT` avec l'état courant en `detail`, et le
        client recharge. Un statut incompatible renvoie `409 INVALID_TRANSITION`.
        La permission est vérifiée par langue quand `lang` est fourni.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/lang'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PageTransitionRequest'}
      x-permission: [pages, edit, default]
      responses:
        '200':
          description: Page en relecture
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/pages/{id}/approve:
    post:
      operationId: adminApprovePage
      tags: [admin-pages]
      summary: Approuve une page en relecture (in_review → approved)
      description: |
        Transition `in_review → approved`. **Pas d'auto-approbation** : le
        compte qui a soumis la page ne peut pas l'approuver, même s'il détient
        `pages:review` ; le refus est `403 AUTO_APPROVAL_FORBIDDEN`.
        `revision` obligatoire, `409 INVALID_TRANSITION` si le statut n'est pas
        `in_review`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PageTransitionRequest'}
      x-permission: [pages, review, default]
      responses:
        '200':
          description: Page approuvée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}

  /admin/pages/{id}/reject:
    post:
      operationId: adminRejectPage
      tags: [admin-pages]
      summary: Rejette une page en relecture et la renvoie en brouillon
      description: |
        Transition `in_review → draft`. `comment` est **obligatoire** : le motif
        est conservé dans l'historique et affiché au rédacteur ; son absence
        renvoie `422 VALIDATION_ERROR` sur le champ `comment`.
        `revision` obligatoire, `409 INVALID_TRANSITION` sinon.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PageTransitionRequest'}
      x-permission: [pages, review, default]
      responses:
        '200':
          description: Page renvoyée en brouillon
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/pages/{id}/publish:
    post:
      operationId: adminPublishPage
      tags: [admin-pages]
      summary: Publie une page approuvée (approved → published)
      description: |
        Transition `approved → published`. La publication reste une action
        distincte de l'approbation (`pages:publish`). Refus possibles :
        `409 INVALID_TRANSITION` si la page n'est pas approuvée ;
        `409 SECTION_MEDIA_ALT_MISSING` si une image non décorative n'a pas de
        texte alternatif dans chaque langue publiée, avec `errors[].field` en
        `sections[].config.media.alt.<lang>` ; `422` si
        `banners_pending=true` (bandeaux légaux non finalisés).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PageTransitionRequest'}
      x-permission: [pages, publish, default]
      responses:
        '200':
          description: Page publiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/sectors:
    get:
      operationId: adminListSectors
      tags: [admin-content]
      summary: Liste complète des secteurs et sous-catégories (EF-104)
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Sector'}
    post:
      operationId: adminCreateSector
      tags: [admin-content]
      summary: Création d'un secteur ou sous-catégorie
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SectorUpsert'}
      x-permission: [pages, create, default]
      responses:
        '201': {description: 'Secteur créé'}

  /admin/sectors/{id}:
    patch:
      operationId: adminUpdateSector
      tags: [admin-content]
      summary: Mise à jour d'un secteur (validation approuvée par le cabinet)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approved: {type: boolean}
                position: {type: integer}
      x-permission: [pages, edit, default]
      responses:
        '200': {description: 'Mis à jour'}
    delete:
      operationId: adminDeleteSector
      tags: [admin-content]
      summary: Suppression d'un secteur
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [pages, delete, default]
      responses:
        '204': {description: 'Supprimé'}

  /admin/intervention-types:
    get:
      operationId: adminListInterventionTypes
      tags: [admin-content]
      summary: Liste des modes d'intervention (EF-103)
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InterventionType'}

  /admin/intervention-types/{id}:
    patch:
      operationId: adminUpdateInterventionType
      tags: [admin-content]
      summary: Mise à jour d'un type d'intervention
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sort_order: {type: integer}
      x-permission: [pages, edit, default]
      responses:
        '200': {description: 'Mis à jour'}

  /admin/offices:
    get:
      operationId: adminListOffices
      tags: [admin-settings]
      summary: Gestion des bureaux et implantations (EF-106)
      x-permission: [offices, view, default]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Office'}
    post:
      operationId: adminCreateOffice
      tags: [admin-settings]
      summary: Création d'un nouveau bureau
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfficeUpsert'}
      x-permission: [offices, create, default]
      responses:
        '201': {description: 'Bureau créé'}

  /admin/offices/{id}:
    patch:
      operationId: adminUpdateOffice
      tags: [admin-settings]
      summary: Modification des coordonnées d'un bureau
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfficeUpsert'}
      x-permission: [offices, edit, default]
      responses:
        '200': {description: 'Bureau mis à jour'}
    delete:
      operationId: adminDeleteOffice
      tags: [admin-settings]
      summary: Suppression d'un bureau (refusée pour le siège sans successeur)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [offices, delete, default]
      responses:
        '204': {description: 'Bureau supprimé'}
        '400': {$ref: '#/components/responses/Eproblem'}

  /admin/team:
    get:
      operationId: adminListTeam
      tags: [admin-settings]
      summary: Gestion des membres de l'équipe et fondateur (EF-107)
      x-permission: [team, view, default]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TeamMember'}
    post:
      operationId: adminCreateTeamMember
      tags: [admin-settings]
      summary: Ajout d'un membre d'équipe
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamMemberUpsert'}
      x-permission: [team, create, default]
      responses:
        '201': {description: 'Membre créé'}

  /admin/team/{id}:
    patch:
      operationId: adminUpdateTeamMember
      tags: [admin-settings]
      summary: Mise à jour d'un membre d'équipe
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamMemberUpsert'}
      x-permission: [team, edit, default]
      responses:
        '200': {description: 'Mis à jour'}
    delete:
      operationId: adminDeleteTeamMember
      tags: [admin-settings]
      summary: Suppression d'un membre d'équipe (refusée pour le fondateur)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [team, delete, default]
      responses:
        '204': {description: 'Supprimé'}
        '400': {$ref: '#/components/responses/Eproblem'}

  /admin/settings:
    get:
      operationId: adminListSettings
      tags: [admin-settings]
      summary: Liste des groupes de paramètres (EF-510)
      x-permission: [settings, view, default]
      responses:
        '200':
          description: Groupes de configuration
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SiteSettingGroup'}

  /admin/settings/{group_key}:
    get:
      operationId: adminGetSettingGroup
      tags: [admin-settings]
      summary: Lecture des réglages d'un groupe spécifique
      parameters:
        - name: group_key
          in: path
          required: true
          schema: {type: string, enum: [identity, contact, cookies, ui_copy, features, seo, retention]}
      x-permission: [settings, view, default]
      responses:
        '200':
          description: Paramètres du groupe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteSettingGroup'}
    put:
      operationId: adminUpdateSettingGroup
      tags: [admin-settings]
      summary: Enregistrement des réglages d'un groupe
      parameters:
        - name: group_key
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      x-permission: [settings, edit, default]
      responses:
        '200': {description: 'Réglages enregistrés'}

  /admin/media:
    get:
      operationId: adminListMedia
      tags: [admin-media]
      summary: Médiathèque — liste paginée avec filtres et recherche (EF-801..803)
      description: |
        La médiathèque regroupe visuellement par dossier, mais ce dossier se
        déduit de `kind` : `image` → images, `video` → videos, `pdf` et
        `document` → documents. Aucun champ `folder` n'est stocké. Les filtres
        d'usage et de date, ainsi que le tri, alimentent la barre de filtres.
        Un média `deleted` n'apparaît jamais. `usages` reste vide en liste :
        il n'est renseigné que sur `GET /admin/media/{id}`.
      parameters:
        - name: kind
          in: query
          schema: {type: string, enum: [image, video, pdf, document]}
        - name: search
          in: query
          schema: {type: string}
        - name: usage
          in: query
          schema: {type: string, enum: [used, unused]}
        - name: created_from
          in: query
          schema: {type: string, format: date}
        - name: created_to
          in: query
          schema: {type: string, format: date}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, -created_at, size_bytes, -size_bytes]}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      x-permission: [media, view, default]
      responses:
        '200':
          description: Liste des médias
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/MediaItem'}
                  total: {type: integer}

  /admin/media/limits:
    get:
      operationId: adminMediaLimits
      tags: [admin-media]
      summary: Limites de téléversement par dossier, lues dans la configuration
      description: |
        Alimente l'aide de l'écran de téléversement et le contrôle préalable,
        sans aucune limite recopiée en dur dans le client : les valeurs viennent
        de la configuration du serveur. Le serveur reste l'autorité : un fichier
        hors limite est refusé par `415` avec `errors[0].code` valant
        `MIME_NOT_ALLOWED`, `TOO_LARGE` ou `INFECTED`.
      x-permission: [media, view, default]
      responses:
        '200':
          description: Limites par dossier
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaLimits'}

  /admin/media/upload:
    post:
      operationId: adminUploadMedia
      tags: [admin-media]
      summary: Téléversement sécurisé de fichier (magic bytes, ClamAV, EF-801)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                kind: {type: string, enum: [image, pdf, document]}
      x-permission: [media, create, default]
      responses:
        '201':
          description: Média enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaItem'}
        '415': {$ref: '#/components/responses/Eproblem'}

  /admin/media/{id}:
    get:
      operationId: adminGetMedia
      tags: [admin-media]
      summary: Métadonnées et références d'usage d'un média
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [media, view, default]
      responses:
        '200':
          description: Média
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaItem'}
    delete:
      operationId: adminDeleteMedia
      tags: [admin-media]
      summary: Suppression d'un média (refusée si référencé dans un contenu - SC-542)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [media, delete, default]
      responses:
        '204': {description: 'Média supprimé'}
        '409': {$ref: '#/components/responses/Eproblem'}

  /admin/media/{id}/replace:
    post:
      operationId: adminReplaceMedia
      tags: [admin-media]
      summary: Remplace le fichier d'un média en conservant ses références
      description: |
        Même `id`, mêmes usages : l'ancien fichier passe en `status=replaced`.
        L'analyse antivirus s'applique comme au premier envoi (`415` avec
        `errors[0].code` : `MIME_NOT_ALLOWED`, `TOO_LARGE`, `INFECTED`).
        Pour une vidéo, `poster_media_id` et `duration_ms` sont recalculés.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      x-permission: [media, edit, default]
      responses:
        '200':
          description: Média remplacé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaItem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}
        '415': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  # ── Partenaires (bloc de l'accueil, module `pages`) ──
  /admin/partners:
    get:
      operationId: adminListPartners
      tags: [admin-content]
      summary: Partenaires, tous statuts, dans l'ordre d'affichage
      description: |
        Les partenaires alimentent le bloc « partenaires » de l'accueil. La
        permission est celle des pages (`pages:view`) : ils font partie du
        contenu éditorial, pas d'un module séparé.
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Liste des partenaires
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartnerList'}
    post:
      operationId: adminCreatePartner
      tags: [admin-content]
      summary: Crée un partenaire
      description: |
        `code` est un identifiant stable unique : un doublon renvoie `409
        CONFLICT`. `position` situe le partenaire dans le bloc ; `translations`
        porte le nom et la description par langue (`fr`, `en`).
        La publication du partenaire suit celle de la page d'accueil.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartnerUpsert'}
      x-permission: [pages, edit, default]
      responses:
        '201':
          description: Partenaire créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Partner'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/partners/{id}:
    patch:
      operationId: adminUpdatePartner
      tags: [admin-content]
      summary: Modifie un partenaire (nom, logo, lien, ordre, activation)
      description: |
        Mise à jour partielle : seuls les champs fournis changent. Le logo doit
        être un média du dossier `images` (`422 VALIDATION_ERROR` sinon).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartnerUpsert'}
      x-permission: [pages, edit, default]
      responses:
        '200':
          description: Partenaire mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Partner'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
    delete:
      operationId: adminDeletePartner
      tags: [admin-content]
      summary: Supprime un partenaire
      description: |
        Suppression logique, réservée à `pages:delete` (admin) : un rédacteur
        désactive le partenaire (`is_active=false`) au lieu de le supprimer.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [pages, delete, default]
      responses:
        '204': {description: 'Partenaire supprimé'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /admin/redirects:
    get:
      operationId: adminListRedirects
      tags: [admin-settings]
      summary: Liste des redirections 301/302 (EF-511, EF-704)
      x-permission: [seo, view, default]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RedirectItem'}
    post:
      operationId: adminCreateRedirect
      tags: [admin-settings]
      summary: Création manuelle d'une redirection
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RedirectCreate'}
      x-permission: [seo, create, default]
      responses:
        '201': {description: 'Redirection créée'}

  /admin/redirects/{id}:
    delete:
      operationId: adminDeleteRedirect
      tags: [admin-settings]
      summary: Suppression d'une redirection
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [seo, delete, default]
      responses:
        '204': {description: 'Redirection supprimée'}

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin-users]
      summary: Liste des comptes utilisateurs du back-office (EF-513)
      x-permission: [users, view, default]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdminUser'}
    post:
      operationId: adminCreateUser
      tags: [admin-users]
      summary: Création d'un utilisateur back-office
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserCreate'}
      x-permission: [users, create, default]
      responses:
        '201': {description: 'Utilisateur créé'}

  /admin/users/{id}:
    get:
      operationId: adminGetUser
      tags: [admin-users]
      summary: Fiche d'un utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [users, view, default]
      responses:
        '200':
          description: Fiche
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
    patch:
      operationId: adminUpdateUser
      tags: [admin-users]
      summary: Mise à jour des rôles ou du profil utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserUpdate'}
      x-permission: [users, edit, default]
      responses:
        '200': {description: 'Mis à jour'}

  /admin/users/{id}/deactivate:
    post:
      operationId: adminDeactivateUser
      tags: [admin-users]
      summary: Désactivation immédiate d'un compte (révocation des sessions)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      x-permission: [users, deactivate, default]
      responses:
        '200': {description: 'Compte désactivé'}

  /admin/roles:
    get:
      operationId: adminListRoles
      tags: [admin-users]
      summary: Rôles back-office et permissions associées (EF-502)
      x-permission: [users, view, default]
      responses:
        '200':
          description: Rôles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Role'}

  /admin/permissions:
    get:
      operationId: adminListPermissions
      tags: [admin-users]
      summary: Registre fermé des modules et actions de permission
      x-permission: [settings, view, default]
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Permission'}

  /admin/leads:
    get:
      operationId: adminListLeads
      tags: [admin-leads]
      summary: Liste paginée et filtrable des leads reçus (EF-304)
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [new, in_progress, waiting, done, rejected, anonymized]}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      x-permission: [leads, view, default]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LeadDetail'}
                  total: {type: integer}

  /admin/leads/{id}:
    get:
      operationId: adminGetLead
      tags: [admin-leads]
      summary: Détail d'une demande et de ses notes internes (EF-304)
      description: |
        Renvoie la demande complète pour l'écran de traitement, notes
        internes incluses. Un lead anonymisé reste consultable mais sans
        données personnelles, conformément à la politique de rétention.
      x-permission: [leads, view, default]
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Demande détaillée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeadDetail'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /admin/leads/{id}/status:
    patch:
      operationId: adminUpdateLeadStatus
      tags: [admin-leads]
      summary: Transition de statut d'un lead avec traçabilité d'audit (EF-304)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeadStatusUpdate'}
      x-permission: [leads, status, default]
      responses:
        '200': {description: 'Statut mis à jour'}

  /admin/leads/{id}/notes:
    post:
      operationId: adminAddLeadNote
      tags: [admin-leads]
      summary: Ajout d'une note interne sur un lead
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeadNoteCreate'}
      x-permission: [leads, notes, default]
      responses:
        '201': {description: 'Note ajoutée'}

  /admin/leads/export.csv:
    get:
      operationId: adminExportLeadsCsv
      tags: [admin-leads]
      summary: Export CSV des leads (droit requis, journalisé dans l'audit - EF-305)
      x-permission: [leads, export, default]
      responses:
        '200':
          description: Fichier CSV
          content:
            text/csv:
              schema: {type: string}

  /admin/audit:
    get:
      operationId: adminAuditLog
      tags: [admin-audit]
      summary: Journal d'audit append-only immuable (EF-901)
      parameters:
        - name: entity_type
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 50}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      x-permission: [audit, view, default]
      responses:
        '200':
          description: Entrées audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
                  total: {type: integer}

# =========================================================================
# 4. COMPOSANTS (PARAMÈTRES, RÉPONSES, SCHÉMAS)
# =========================================================================

components:
  parameters:
    csrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        Nom figé. Doit égaler la valeur du cookie `csrf_token`.
        Obligatoire sur les mutations `/admin/**` (sauf login, forgot, reset, activate).
      schema: {type: string, minLength: 16}
    lang:
      name: lang
      in: query
      description: BCP-47 (fr, en)
      schema: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
    allLangs:
      name: all_langs
      in: query
      schema: {type: boolean, default: false}
    ifNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    revision:
      name: revision
      in: query
      required: true
      description: |
        Révision de page lue par le client (verrou optimiste). Une valeur
        périmée renvoie `409 CONFLICT` avec l'état courant en `detail`.
      schema: {type: integer, minimum: 0}
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: Cookie de session HttpOnly. Nom figé.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: En-tête CSRF. Nom figé. Valeur = cookie csrf_token.

  responses:
    Eproblem:
      description: RFC 7807 (problem+json)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
        db: {type: string, enum: [up, down]}

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code:
          type: string
          description: Code d'erreur stable
          enum:
            - VALIDATION_ERROR
            - UNKNOWN_LANG
            - CONTENT_NOT_FOUND
            - REDIRECTED
            - UNAUTHENTICATED
            - SESSION_EXPIRED
            - MFA_REQUIRED
            - FORBIDDEN
            - CSRF_TOKEN_MISSING
            - CSRF_TOKEN_MISMATCH
            - NOT_PERMITTED_LANG
            - INVALID_TRANSITION
            - CONFLICT
            - RATE_LIMITED
            - IDEMPOTENT_REPLAY_CONFLICT
            - UPLOAD_REJECTED
            - IDOR_BLOCKED
            - TOKEN_EXPIRED
            - NOT_IMPLEMENTED
            - SERVER_ERROR
            - MFA_ALREADY_ENABLED
            - MFA_ENROLLMENT_REQUIRED
            - MFA_CODE_INVALID
            - RECOVERY_CODE_INVALID
            - AUTO_APPROVAL_FORBIDDEN
            - SECTION_TYPE_NOT_EDITABLE
            - SECTION_MEDIA_ALT_MISSING
            - MEDIA_IN_USE
            - POSITION_CONFLICT
        detail: {type: string}
        correlation_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}

    Localized:
      type: object
      description: Valeur localisée avec statut de repli explicite
      properties:
        value: {type: string}
        is_fallback: {type: boolean}

    SearchHit:
      type: object
      properties:
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        title: {type: string}
        slug: {type: string}
        href: {type: string}
        rank: {type: number}
        is_fallback: {type: boolean}

    Language:
      type: object
      properties:
        code: {type: string, maxLength: 10}
        label: {type: string}
        direction: {type: string, enum: [ltr, rtl]}
        is_default: {type: boolean}

    ServicesTree:
      type: object
      properties:
        lang: {type: string}
        default_lang: {type: string}
        alternate:
          type: object
          additionalProperties: {type: string}
        fallback:
          type: object
          nullable: true
        families:
          type: array
          items: {$ref: '#/components/schemas/Family'}

    Family:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        tagline: {type: string, nullable: true}
        source_key:
          type: string
          nullable: true
          description: Clé stable d'ancrage public, dérivée du seed ; jamais modifiable.
        position: {type: integer}
        is_active: {type: boolean}
        is_fallback: {type: boolean}
        translations:
          $ref: '#/components/schemas/NodeTranslations'
        domains:
          type: array
          items: {$ref: '#/components/schemas/Domain'}
    Domain:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        intro: {type: string, nullable: true}
        source_key: {type: string, nullable: true}
        position: {type: integer}
        is_active: {type: boolean}
        is_fallback: {type: boolean}
        translations:
          $ref: '#/components/schemas/NodeTranslations'
        groups:
          type: array
          items: {$ref: '#/components/schemas/Group'}
    Group:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        source_key: {type: string, nullable: true}
        position: {type: integer}
        is_active: {type: boolean}
        is_fallback: {type: boolean}
        translations:
          $ref: '#/components/schemas/NodeTranslations'
        services:
          type: array
          items: {$ref: '#/components/schemas/PrestationItem'}
    PrestationItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        source_key: {type: string, nullable: true}
        position: {type: integer}
        is_active: {type: boolean}
        is_fallback: {type: boolean}
        translations:
          $ref: '#/components/schemas/NodeTranslations'
    DomainDetail:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        intro: {$ref: '#/components/schemas/Localized'}
        prev:
          type: object
          nullable: true
          properties:
            slug: {type: string}
            title: {type: string}
        next:
          type: object
          nullable: true
          properties:
            slug: {type: string}
            title: {type: string}
        groups:
          type: array
          items: {$ref: '#/components/schemas/Group'}

    Sector:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        kind: {type: string, enum: [sector, subcategory]}
        slug: {type: string}
        title: {type: string}
        intro: {type: string, nullable: true}
        approved: {type: boolean}
        subcategories:
          type: array
          items: {$ref: '#/components/schemas/Sector'}

    SectorUpsert:
      type: object
      required: [code, kind]
      properties:
        code: {type: string}
        kind: {type: string, enum: [sector, subcategory]}
        parent_id: {type: string, format: uuid, nullable: true}
        position: {type: integer}
        approved: {type: boolean}

    InterventionType:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        slug: {type: string}
        title: {type: string}
        intro: {type: string}
        signature: {type: string}
        sort_order: {type: integer}

    Office:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        is_headquarters: {type: boolean}
        is_active: {type: boolean}
        phone_fixed: {type: string, nullable: true}
        phone_mobile: {type: string, nullable: true}
        email: {type: string, nullable: true}
        map_url: {type: string, nullable: true}
        name: {type: string}
        address_lines:
          type: array
          items: {type: string}
        city: {type: string}

    OfficeUpsert:
      type: object
      required: [code]
      properties:
        code: {type: string}
        is_headquarters: {type: boolean}
        is_active: {type: boolean}
        position: {type: integer}
        phone_fixed: {type: string, nullable: true}
        phone_mobile: {type: string, nullable: true}
        email: {type: string, nullable: true}
        map_url: {type: string, nullable: true}
        media_id: {type: string, format: uuid, nullable: true}

    TeamMember:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        is_founder: {type: boolean}
        is_active: {type: boolean}
        full_name: {type: string}
        role: {type: string}
        bio: {type: string, nullable: true}
        photo_url: {type: string, nullable: true}
        email: {type: string, nullable: true}
        linkedin_url: {type: string, nullable: true}

    TeamMemberUpsert:
      type: object
      required: [code]
      properties:
        code: {type: string}
        is_founder: {type: boolean}
        is_active: {type: boolean}
        position: {type: integer}
        media_id: {type: string, format: uuid, nullable: true}
        email: {type: string, nullable: true}
        linkedin_url: {type: string, nullable: true}

    PublicationSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        excerpt: {type: string, nullable: true}
        category_code: {type: string}
        published_at: {type: string, format: date-time}
        cover_url: {type: string, nullable: true}
        is_fallback: {type: boolean}

    PublicationDetail:
      allOf:
        - $ref: '#/components/schemas/PublicationSummary'
        - type: object
          properties:
            body: {$ref: '#/components/schemas/Localized'}
            author_name: {type: string, nullable: true}
            media:
              type: array
              description: 'Médias ordonnés : galerie et vidéos, par `position`.'
              items: {$ref: '#/components/schemas/PublicationMedia'}
            media_count:
              type: integer
              description: Dérivé de `media` (lecture seule).
            cover_media_id:
              type: string
              format: uuid
              nullable: true
              description: |
                Dérivé (lecture seule) : média de plus petite `position`, ou son
                `poster_media_id` s'il s'agit d'une vidéo.
    PublicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicationSummary'}
        next_cursor: {type: string, nullable: true}
        total: {type: integer}

    PublicationCreate:
      type: object
      required: [title, slug, category_code, lang, body]
      properties:
        slug: {type: string, maxLength: 200, pattern: '^[a-z0-9-]+$'}
        title: {type: string, maxLength: 200}
        excerpt: {type: string, nullable: true}
        category_code: {type: string}
        lang: {type: string, enum: [fr, en]}
        body: {type: string}
        cover_media_id: {type: string, format: uuid, nullable: true}

    LocalizedTexts:
      type: object
      description: Valeurs textuelles complètes en français et en anglais.
      required: [fr, en]
      properties:
        fr: {type: string}
        en: {type: string}
      additionalProperties: false

    PageContentUpdate:
      type: object
      required: [revision]
      properties:
        revision: {type: integer, minimum: 0}
        title: {type: string}
        nav_label: {type: string}
        intro: {type: string}

    PageSeoUpdate:
      type: object
      required: [revision]
      properties:
        revision: {type: integer, minimum: 0}
        seo_title: {type: string}
        seo_description: {type: string}

    PageSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        page_key: {type: string}
        template: {type: string}
        is_in_nav: {type: boolean}
        nav_position: {type: integer, nullable: true}
        is_system: {type: boolean}
        status:
          type: string
          enum: [draft, in_review, approved, published, archived]

    PageDetail:
      type: object
      required: [id, status, revision, sections]
      properties:
        id: {type: string, format: uuid}
        page_key: {type: string}
        template: {type: string}
        is_in_nav: {type: boolean}
        nav_position: {type: integer, nullable: true}
        is_system: {type: boolean}
        status:
          type: string
          enum: [draft, in_review, approved, published, archived]
        banners_pending: {type: boolean}
        revision:
          type: integer
          description: |
            Révision de la page. À renvoyer dans **toute** mutation (section,
            workflow) ; une révision périmée renvoie `409 CONFLICT`.
        title: {$ref: '#/components/schemas/Localized'}
        titles:
          type: object
          description: |
            Titre par langue (`fr`, `en`), pour l'édition côte à côte. `title`
            reste la valeur de la langue demandée avec son `is_fallback`.
          additionalProperties: {type: string}
        nav_label: {$ref: '#/components/schemas/LocalizedTexts'}
        intro: {$ref: '#/components/schemas/LocalizedTexts'}
        seo_title: {$ref: '#/components/schemas/LocalizedTexts'}
        seo_description: {$ref: '#/components/schemas/LocalizedTexts'}
        slugs:
          type: object
          description: Slug par langue (`fr`, `en`).
          additionalProperties: {type: string}
        section_count:
          type: integer
          description: Nombre de sections, dérivé de `sections`.
        sections:
          type: array
          items: {$ref: '#/components/schemas/Section'}
    Section:
      type: object
      properties:
        id: {type: string, format: uuid}
        section_type: {type: string}
        source_key:
          type: string
          nullable: true
          description: |
            Clé d'ancre publique. Dérivée du seed pour les blocs existants et
            jamais modifiable : elle change avec `section_type`, pas avec les textes.
        position: {type: integer}
        is_active: {type: boolean}
        config:
          $ref: '#/components/schemas/SectionConfig'
        data:
          type: object
          description: |
            Données du type, **par langue** : `{ "fr": {...}, "en": {...} }`.
            Les champs sont ceux du catalogue (`GET /admin/section-types`).
            Une langue absente signifie « non traduite », pas « vide ».
          additionalProperties:
            type: object
            additionalProperties: true

    SectionUpsert:
      type: object
      required: [section_type, position, revision]
      properties:
        section_type: {type: string, description: Code du catalogue (`GET /admin/section-types`).}
        source_key: {type: string, nullable: true}
        position: {type: integer, minimum: 0}
        is_active: {type: boolean, default: true}
        config: {$ref: '#/components/schemas/SectionConfig'}
        data:
          type: object
          description: Données initiales par langue (`fr`, `en`).
          additionalProperties:
            type: object
            additionalProperties: true
        revision:
          type: integer
          description: Révision de page lue par le client (verrou optimiste).

    SectionContentUpdate:
      type: object
      required: [data, revision]
      properties:
        data:
          type: object
          description: Valeurs des champs du type, pour une seule langue.
          additionalProperties: true
        revision: {type: integer, minimum: 0}

    SectionMutationResult:
      type: object
      required: [page, section]
      description: |
        Mutation de section : la page entière accompagne la section pour que le
        client conserve `revision` et l'ordre sans seconde requête.
      properties:
        page: {$ref: '#/components/schemas/PageDetail'}
        section: {$ref: '#/components/schemas/Section'}
    PublicSettings:
      type: object
      description: Coordonnées et SEO publics (EF-106)
      properties:
        legal_name: {type: string}
        tagline: {type: string}
        email: {type: string, format: email}
        phone_fixed: {type: string}
        phone_mobile: {type: string}
        city: {type: string}
        address: {type: string, nullable: true}
        socials:
          type: object
          additionalProperties: {type: string}
        seo_default:
          type: object
          properties:
            og_image: {type: string}
            robots: {type: string}

    SiteSettingGroup:
      type: object
      properties:
        group_key: {type: string}
        settings:
          type: object
          additionalProperties: true

    MediaItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [image, video, pdf, document]}
        storage_key: {type: string}
        url: {type: string}
        mime: {type: string}
        size_bytes: {type: integer}
        status: {type: string, enum: [active, replaced, deleted]}
        alt:
          type: string
          nullable: true
          description: Valeur de la langue demandée ; avec `all_langs=true`, lire `translations`.
        caption: {type: string, nullable: true}
        translations:
          type: object
          description: |
            Textes par langue (`fr`, `en`). L'écriture passe par
            `PUT /admin/content/media/{id}/translation/{lang}`.
          additionalProperties:
            type: object
            properties:
              alt: {type: string, nullable: true}
              caption: {type: string, nullable: true}
        usage_count:
          type: integer
          description: Nombre de contenus qui référencent ce média.
        usages:
          type: array
          description: Renseigné sur `GET /admin/media/{id}`, vide dans la liste.
          items: {$ref: '#/components/schemas/MediaUsage'}
        scan_status: {type: string, enum: [pending, clean, infected]}
        duration_ms: {type: integer, nullable: true}
        width: {type: integer, nullable: true}
        height: {type: integer, nullable: true}
        created_at: {type: string, format: date-time}
    # ── Catalogue des types de section ──
    SectionTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SectionType'}

    SectionType:
      type: object
      required: [code, editable, fields]
      properties:
        code: {type: string}
        label: {$ref: '#/components/schemas/Localized'}
        usage:
          type: string
          description: Pages d'usage prévues par la modélisation éditoriale (doc 16 §3.4).
        editable:
          type: boolean
          description: |
            Faux = type hors périmètre d'édition (repli lecture seule). Une
            écriture sur un tel type renvoie `409 SECTION_TYPE_NOT_EDITABLE`.
        media_slots:
          type: array
          description: Emplacements média que le type accepte, pour l'éditeur.
          items: {type: string, enum: [image, gallery, video]}
        fields:
          type: array
          items: {$ref: '#/components/schemas/SectionField'}

    SectionField:
      type: object
      required: [key, kind, label, required]
      description: |
        Description d'un champ de section : le client génère le contrôle depuis
        `kind` et n'a aucune liste de champs codée en dur par type.
      properties:
        key: {type: string}
        kind: {type: string, enum: [text, textarea, list, media, video, number, boolean]}
        label: {$ref: '#/components/schemas/Localized'}
        required: {type: boolean}
        max_length: {type: integer, nullable: true}
        item_fields:
          type: array
          description: Champs de chaque élément quand `kind=list`.
          items: {$ref: '#/components/schemas/SectionField'}

    SectionConfig:
      type: object
      description: |
        Configuration non traduite d'une section : médias, galerie, vidéo.
        Versionné et décrit, pour qu'aucun bloc média ne soit codé en dur.
      properties:
        media: {$ref: '#/components/schemas/SectionMedia'}
        gallery:
          type: array
          items: {$ref: '#/components/schemas/SectionMedia'}
        video: {$ref: '#/components/schemas/SectionVideo'}

    SectionMedia:
      type: object
      required: [media_id, decorative]
      properties:
        media_id: {type: string, format: uuid}
        decorative: {type: boolean}
        alt:
          type: object
          description: Obligatoire si `decorative=false`, une entrée par langue publiée.
          additionalProperties: {type: string}
        caption:
          type: object
          additionalProperties: {type: string}

    SectionVideo:
      type: object
      required: [provider, video_id]
      properties:
        provider: {type: string, enum: [youtube, vimeo, upload]}
        video_id: {type: string}
        url: {type: string, format: uri}
        poster_media_id: {type: string, format: uuid, nullable: true}
        caption: {type: object, additionalProperties: {type: string}}
        transcription: {type: object, additionalProperties: {type: string}}

    # ── Arborescence des services ──
    NodeTranslations:
      type: object
      description: |
        Traductions d'un nœud, par langue (`fr`, `en`). Renseigné avec
        `all_langs=true` sur `GET /admin/content/tree`, sinon absent.
      additionalProperties:
        type: object
        properties:
          title: {type: string}
          slug: {type: string}

    # ── Workflow éditorial ──
    PageTransitionRequest:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          description: Révision de la page lue par le client (verrou optimiste).
        comment:
          type: string
          maxLength: 1000
          description: Obligatoire pour `reject` (motif), facultatif ailleurs.

    # ── Médiathèque ──
    MediaUsage:
      type: object
      required: [entity_type, entity_id, title, edit_path]
      properties:
        entity_type: {type: string, enum: [page_section, page, publication, node]}
        entity_id: {type: string, format: uuid}
        title: {type: string}
        edit_path:
          type: string
          description: Route du Backoffice pour ouvrir le contenu qui référence le média.

    MediaLimits:
      type: object
      required: [items]
      description: |
        Limites de téléversement lues dans la configuration du serveur, jamais
        recopiées en dur dans le client.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MediaLimit'}

    MediaLimit:
      type: object
      required: [kind, mime, max_bytes]
      properties:
        kind: {type: string, enum: [image, video, pdf, document]}
        mime:
          type: array
          items: {type: string}
        max_bytes: {type: integer}
        max_width: {type: integer, nullable: true}
        max_height: {type: integer, nullable: true}
        max_duration_ms: {type: integer, nullable: true}

    # ── Partenaires ──
    Partner:
      type: object
      required: [id, position, is_active]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, description: Identifiant stable unique.}
        logo_media_id: {type: string, format: uuid, nullable: true}
        website_url: {type: string, format: uri, nullable: true}
        position: {type: integer}
        is_active: {type: boolean}
        is_fallback: {type: boolean}
        translations:
          type: object
          description: Nom et description par langue (`fr`, `en`).
          additionalProperties:
            type: object
            properties:
              name: {type: string}
              description: {type: string, nullable: true}

    PartnerUpsert:
      type: object
      required: [translations]
      properties:
        code: {type: string}
        logo_media_id: {type: string, format: uuid, nullable: true}
        website_url: {type: string, format: uri, nullable: true}
        position: {type: integer, minimum: 0}
        is_active: {type: boolean, default: true}
        translations:
          type: object
          additionalProperties:
            type: object
            properties:
              name: {type: string}
              description: {type: string, nullable: true}

    PartnerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Partner'}

    # ── Médias d'une publication ──
    PublicationMedia:
      type: object
      required: [id, position, source, alt, caption]
      description: |
        Média attaché à une publication. `cover_media_id` et `media_count` de
        `PublicationDetail` sont **dérivés** de cette liste : la couverture est
        le média de plus petite `position` (son `poster_media_id` s'il s'agit
        d'une vidéo), `media_count` en est la longueur. Aucun des deux n'est
        modifiable directement.
      properties:
        id: {type: string, format: uuid}
        publication_id: {type: string, format: uuid}
        position:
          type: integer
          minimum: 0
          description: Unique par publication ; un doublon renvoie `409 POSITION_CONFLICT`.
        source: {type: string, enum: [upload, external]}
        kind: {type: string, enum: [image, video]}
        media_id:
          type: string
          format: uuid
          nullable: true
          description: Obligatoire si `source=upload`.
        external_url:
          type: string
          format: uri
          nullable: true
          description: Obligatoire si `source=external` (YouTube, Vimeo, CDN).
        poster_media_id:
          type: string
          format: uuid
          nullable: true
          description: Vignette d'une vidéo ; sert de couverture si elle est en position 0.
        alt:
          type: object
          description: Texte alternatif par langue (`fr`, `en`).
          additionalProperties: {type: string}
        caption:
          type: object
          description: Légende par langue (`fr`, `en`).
          additionalProperties: {type: string}
        duration_ms:
          type: integer
          nullable: true
          description: Durée d'une vidéo ; dérivée du fichier pour `source=upload`.
        created_at: {type: string, format: date-time}

    PublicationMediaUpsert:
      type: object
      required: [position, source]
      properties:
        position: {type: integer, minimum: 0}
        source: {type: string, enum: [upload, external]}
        kind: {type: string, enum: [image, video]}
        media_id: {type: string, format: uuid, nullable: true}
        external_url: {type: string, format: uri, nullable: true}
        poster_media_id: {type: string, format: uuid, nullable: true}
        alt: {type: object, additionalProperties: {type: string}}
        caption: {type: object, additionalProperties: {type: string}}

    PublicationMediaList:
      type: object
      required: [items, media_count, cover_media_id]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicationMedia'}
        media_count: {type: integer}
        cover_media_id: {type: string, format: uuid, nullable: true}
    ContentVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        lang: {type: string}
        version_num: {type: integer}
        author_name: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        data: {type: object}

    RedirectItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        old_path: {type: string}
        target_path: {type: string}
        status_code: {type: integer, enum: [301, 302]}
        auto_generated: {type: boolean}
        created_at: {type: string, format: date-time}

    RedirectCreate:
      type: object
      required: [old_path, target_path]
      properties:
        old_path: {type: string}
        target_path: {type: string}
        status_code: {type: integer, enum: [301, 302], default: 301}

    AdminUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        is_active: {type: boolean}
        default_lang: {type: string}
        must_reset_password: {type: boolean}
        mfa_enabled: {type: boolean}
        roles:
          type: array
          items: {type: string}
        last_login_at: {type: string, format: date-time, nullable: true}

    AdminUserCreate:
      type: object
      required: [email, display_name]
      description: |
        Mot de passe optionnel. S'il est omis, le Backend envoie une
        invitation signée (Q-105 / EF-513) ; le compte naît avec
        `password_hash=NULL` et `must_reset_password=true`.
        S'il est fourni, longueur minimale 14 (page 09).
      properties:
        email: {type: string, format: email}
        password:
          type: string
          format: password
          minLength: 14
          description: Optionnel. Absent → invitation, pas de mot de passe initial.
        display_name: {type: string}
        default_lang: {type: string, default: fr}
        send_invitation:
          type: boolean
          default: true
          description: Ignoré si `password` est fourni et que l'invitation n'est pas souhaitée.
        role_codes:
          type: array
          items: {type: string}

    AdminUserUpdate:
      type: object
      properties:
        display_name: {type: string}
        default_lang: {type: string}
        role_codes:
          type: array
          items: {type: string}

    Role:
      type: object
      description: |
        Rôle et permissions effectives. Les permissions de `viewer` restent
        **à confirmer** : le seed ne lui en accorde aucune, alors que le
        Backoffice a besoin de `pages:view` et `publications:view` pour que le
        compte de démonstration voie les écrans. Point ouvert pour le Backend,
        sans effet sur le contrat tant que la décision n'est pas prise.
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        label: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}

    Permission:
      type: object
      properties:
        id: {type: string, format: uuid}
        module: {type: string}
        action: {type: string}
        lang: {type: string, nullable: true}

    LeadDetail:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        subject: {type: string}
        message: {type: string}
        lang: {type: string}
        status: {type: string, enum: [new, in_progress, waiting, done, rejected, anonymized]}
        assigned_to: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        notes:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              author_name: {type: string}
              note: {type: string}
              created_at: {type: string, format: date-time}

    LeadStatusUpdate:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [new, in_progress, waiting, done, rejected, anonymized]}
        note: {type: string}

    LeadNoteCreate:
      type: object
      required: [note]
      properties:
        note: {type: string}
        internal: {type: boolean, default: true}

    AuditEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        actor_type: {type: string, enum: [user, system]}
        actor_name: {type: string, nullable: true}
        action: {type: string}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid, nullable: true}
        ip: {type: string, nullable: true}

    ContactRequest:
      type: object
      required: [name, email, subject, message]
      properties:
        name: {type: string, maxLength: 120}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        subject: {type: string, maxLength: 200}
        message: {type: string, maxLength: 5000}
        lang: {type: string}
        honeypot: {type: string, description: Doit rester vide (chasse au bot)}
        elapsed_ms: {type: integer, description: Délai de rédaction (anti-bot)}

    ClientDocument:
      type: object
      properties:
        id: {type: string, format: uuid}
        original_name: {type: string}
        mime: {type: string}
        size_bytes: {type: integer}
        created_at: {type: string, format: date-time}

    NodeUpsert:
      type: object
      required: [node_type]
      properties:
        node_type: {type: string, enum: [family, domain, group, service]}
        parent_id: {type: string, format: uuid, nullable: true}
        position: {type: integer, minimum: 0}
        is_active: {type: boolean, default: true}
        translations:
          $ref: '#/components/schemas/NodeTranslations'
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 1}
        totp_code:
          type: string
          minLength: 6
          maxLength: 8
          description: Code TOTP. Requis au second essai si `status=mfa_required`.
        recovery_code:
          type: string
          minLength: 8
          description: |
            Code de secours à usage unique, alternative à `totp_code` quand
            l'application d'authentification est inaccessible.
    AdminLoginAuthenticated:
      type: object
      required: [status, user, csrf_token]
      properties:
        status: {type: string, enum: [authenticated]}
        user: {$ref: '#/components/schemas/AdminSessionUser'}
        csrf_token:
          type: string
          description: Même valeur que le cookie `csrf_token` (non-HttpOnly).

    AdminLoginMfaRequired:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [mfa_required]}

    AdminLoginResponse:
      description: |
        Discriminateur `status`. `authenticated` pose les cookies `session_id`
        et `csrf_token`. `mfa_required` n'en pose aucun ; le client renvoie
        le même login avec `totp_code` ou `recovery_code`.
        `mfa_enrollment_required` n'en pose aucun non plus : le compte détient
        un rôle à MFA obligatoire sans TOTP enrôlé, et le client conduit
        l'enrôlement avec `enrollment_token`.
      oneOf:
        - $ref: '#/components/schemas/AdminLoginAuthenticated'
        - $ref: '#/components/schemas/AdminLoginMfaRequired'
        - $ref: '#/components/schemas/AdminLoginMfaEnrollmentRequired'

    AdminLoginMfaEnrollmentRequired:
      type: object
      required: [status, enrollment_token, required_role]
      description: |
        Rôle à MFA obligatoire (`super_admin`, `admin`, `crm`) sans MFA enrôlé.
        Aucun cookie de session : `enrollment_token` (5 min, usage unique)
        n'ouvre que les endpoints `/admin/auth/mfa/enroll*`.
      properties:
        status: {type: string, enum: [mfa_enrollment_required]}
        enrollment_token: {type: string}
        required_role: {type: string}

    AdminMfaEnrollment:
      type: object
      required: [secret, otpauth_uri, digits, period, algorithm]
      properties:
        secret:
          type: string
          description: Secret TOTP base32, renvoyé une seule fois.
        otpauth_uri: {type: string, format: uri}
        digits: {type: integer, enum: [6]}
        period: {type: integer, enum: [30]}
        algorithm: {type: string, enum: [SHA1]}

    RecoveryCodes:
      type: object
      required: [recovery_codes, generated_at]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          description: Dix codes à usage unique, affichés une seule fois.
          items: {type: string}
        generated_at: {type: string, format: date-time}

    AdminMfaEnrollmentConfirmed:
      allOf:
        - $ref: '#/components/schemas/AdminLoginAuthenticated'
        - type: object
          required: [recovery_codes]
          properties:
            recovery_codes:
              type: array
              items: {type: string}
    AdminSessionUser:
      type: object
      required: [id, email, display_name, is_active, must_reset_password, permissions]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        is_active: {type: boolean}
        default_lang: {type: string}
        must_reset_password: {type: boolean}
        mfa_enabled: {type: boolean}
        mfa_enrollment_required:
          type: boolean
          description: |
            Vrai quand un rôle du compte impose le MFA et qu'aucun TOTP n'est
            enrôlé : l'interface propose l'enrôlement avant tout autre écran.
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
    AdminMeResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user: {$ref: '#/components/schemas/AdminSessionUser'}
        csrf_token: {type: string}

    AdminPasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}

    AdminPasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, format: password, minLength: 14}

    AdminPasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, format: password, minLength: 14}

    AdminActivateRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, format: password, minLength: 14}
        totp_code:
          type: string
          description: Optionnel. Enrôlement TOTP si le rôle l'exige et qu'un secret a été scanné hors bande.

    LeadSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        subject: {type: string}
        status: {type: string, enum: [new, in_progress, waiting, done, rejected, anonymized]}
        created_at: {type: string, format: date-time}

    AdminDashboard:
      type: object
      description: |
        Agrégats du tableau de bord. Chaque groupe n'est présent que si la
        session détient la permission correspondante ; un groupe absent vaut
        "non autorisé" et ne doit pas être affiché.
      required: [generated_at]
      properties:
        generated_at: {type: string, format: date-time}
        leads:
          type: object
          description: Présent avec `leads:view`.
          required: [new_count, recent]
          properties:
            new_count: {type: integer, minimum: 0}
            recent:
              type: array
              items: {$ref: '#/components/schemas/LeadSummary'}
        publications:
          type: object
          description: Présent avec `publications:view`.
          required: [draft_count, in_review_count]
          properties:
            draft_count: {type: integer, minimum: 0}
            in_review_count: {type: integer, minimum: 0}
        content:
          type: object
          description: Présent avec `pages:view`.
          required: [unpublished_changes_count]
          properties:
            unpublished_changes_count:
              type: integer
              minimum: 0
              description: Entités éditoriales modifiées plus récentes que le dernier job `success`.
        publication:
          allOf:
            - $ref: '#/components/schemas/PublicationSiteStatus'
          description: Présent avec `publications:view`.
        i18n:
          type: object
          description: Présent avec `settings:view`.
          required: [completeness_pct, missing_count]
          properties:
            completeness_pct: {type: number, minimum: 0, maximum: 100}
            missing_count: {type: integer, minimum: 0}
        audit:
          type: object
          description: Présent avec `audit:view`.
          required: [recent]
          properties:
            recent:
              type: array
              items: {$ref: '#/components/schemas/AuditEntry'}

    PublicationJob:
      type: object
      required: [id, status, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, building, success, failed]}
        triggered_by_name: {type: string, nullable: true}
        step: {type: string, nullable: true}
        step_index: {type: integer, nullable: true}
        step_total: {type: integer, nullable: true}
        log_output: {type: string, nullable: true}
        error_summary: {type: string, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
