openapi: 3.1.0
info:
  title: EXAUCE Backend — Contrat API v1
  version: 1.0.0-M3.1
  description: |
    Contrat d'API de référence pour le Backend (FastAPI + PostgreSQL) d'EXAUCE
    Audit & Conseils SAS.
    Trois surfaces : public (`/api/v1`), espace client (`/api/v1/client`),
    back-office (`/api/v1/admin`).
    Chaque réponse de contenu est mono-langue avec repli explicite (`is_fallback`).

    **Noms figés — session et CSRF (ADR-004 / ADR-009, page 09).**
    Le Backend et le Back-office n'utilisent que ces identifiants :

    | Canal | Nom | Attributs |
    |---|---|---|
    | Cookie de session | `session_id` | HttpOnly, Secure (prod), SameSite=Lax, Domain `.exauceac.com` (prod) |
    | Cookie CSRF | `csrf_token` | **non-HttpOnly** (lisible JS), Secure (prod), SameSite=Lax, Domain `.exauceac.com` (prod) |
    | En-tête CSRF | `X-CSRF-Token` | obligatoire sur toute mutation (`POST`/`PUT`/`PATCH`/`DELETE`) de `/admin/**` hors login, forgot, reset, activate |

    Le jeton CSRF est émis au login réussi (`status=authenticated`), à l'activation,
    et renvoyé par `GET /admin/auth/me`. Le client recopie le cookie `csrf_token`
    dans l'en-tête `X-CSRF-Token`. Écarts d'en-tête : `403` `CSRF_TOKEN_MISSING`
    ou `CSRF_TOKEN_MISMATCH`.

    Mot de passe : Argon2id, **longueur minimale 14** (page 09). Aucun jeton
    d'accès n'est renvoyé dans le corps JSON (pas de Bearer, pas de localStorage).
  contact:
    name: Projet EXAUCE
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Serveur API v1
tags:
  - name: public-content
    description: Consultation publique du contenu du site (services, pages, secteurs, publications)
  - name: public-search
    description: Recherche plein texte
  - name: public-contact
    description: Formulaire de contact et capture de leads
  - name: client
    description: Espace client (v2)
  - name: admin-auth
    description: Authentification back-office (session cookie + CSRF)
  - name: admin-reports
    description: Tableau de bord et agrégats
  - name: admin-publication
    description: Jobs de publication SSG et flux SSE
  - name: admin-notifications
    description: Notifications in-app (leads)
  - name: admin-search
    description: Recherche back-office — à venir (501)
  - name: admin-content
    description: Gestion éditoriale des services et publications
  - name: admin-pages
    description: Gestion des pages et des sections typées
  - name: admin-media
    description: Médiathèque
  - name: admin-settings
    description: Paramètres du site et SEO
  - name: admin-leads
    description: Gestion des demandes de contact
  - name: admin-users
    description: Gestion des utilisateurs et rôles
  - name: admin-audit
    description: Journal d'audit et conformité
  - name: infra
    description: Healthcheck et supervision (hors contrat applicatif)

paths:
  # =========================================================================
  # 1. SURFACES PUBLIQUES
  # =========================================================================

  /health:
    get:
      operationId: getHealth
      tags: [infra]
      summary: Santé de l'API (healthcheck Docker, supervision)
      description: |
        Endpoint d'infrastructure. Ne dépend pas de la base : sert à la
        healthcheck Compose et à la supervision. Exclu du fuzzing de contrat
        (lignes de base de Schemathesis).
      responses:
        '200':
          description: Processus vivant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}

  /services-tree:
    get:
      operationId: getServicesTree
      tags: [public-content]
      summary: Arbre complet des services (4 niveaux) dans la langue demandée
      parameters:
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Arbre publié (ou repli explicite)
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServicesTree'}
        '304': {description: 'Non modifié (ETag)'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /familles/{slug}:
    get:
      operationId: getFamily
      tags: [public-content]
      summary: Détail d'une famille de services avec liste de ses domaines
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]+$'}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Famille publiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Family'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /domains/{slug}:
    get:
      operationId: getDomain
      tags: [public-content]
      summary: Détail d'un domaine avec groupes et prestations (EF-102)
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]+$'}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Domaine publié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainDetail'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /sectors:
    get:
      operationId: listSectors
      tags: [public-content]
      summary: Univers et sous-catégories de clientèle (EF-104)
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Liste des secteurs approuvés
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Sector'}

  /intervention-types:
    get:
      operationId: listInterventionTypes
      tags: [public-content]
      summary: Types d'intervention (récurrentes et ponctuelles - EF-103)
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Types d'intervention
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InterventionType'}

  /offices:
    get:
      operationId: listOffices
      tags: [public-content]
      summary: Bureaux et implantations du cabinet (EF-106)
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Liste des bureaux actifs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Office'}

  /team:
    get:
      operationId: listTeam
      tags: [public-content]
      summary: Équipe et fondateur (EF-107)
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Membres de l'équipe
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TeamMember'}

  /publications:
    get:
      operationId: listPublications
      tags: [public-content]
      summary: Publications publiées (paginées au curseur - EF-105)
      parameters:
        - $ref: '#/components/parameters/lang'
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
        - name: category
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Liste publiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PublicationSummary'}
                  next_cursor: {type: string, nullable: true}

  /publications/{slug}:
    get:
      operationId: getPublication
      tags: [public-content]
      summary: Détail d'une publication publiée (EF-105)
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]+$'}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Publication publiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationDetail'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /pages/{key}:
    get:
      operationId: getPage
      tags: [public-content]
      summary: Page éditoriale avec ses sections typées (EF-107, EF-108)
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Page et ses sections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageDetail'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [public-content]
      summary: Coordonnées, identité et SEO publics (EF-106)
      responses:
        '200':
          description: Paramètres publics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSettings'}

  /languages/active:
    get:
      operationId: listActiveLanguages
      tags: [public-content]
      summary: Langues actives pour le sélecteur du frontend (EF-602)
      responses:
        '200':
          description: Langues actives
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Language'}

  /search:
    get:
      operationId: search
      tags: [public-search]
      summary: Recherche plein texte indexée par langue (EF-201..204)
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 120}
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/SearchHit'}
                  message: {type: string}

  /contact:
    post:
      operationId: submitContact
      tags: [public-contact]
      summary: Soumission du formulaire de contact (EF-301..303)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactRequest'}
      responses:
        '202':
          description: Demande enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [new]}
        '409': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
        '429': {$ref: '#/components/responses/Eproblem'}

  /sitemap.xml:
    get:
      operationId: getSitemapXml
      tags: [public-content]
      summary: Sitemap XML dynamique multi-langue (EF-701)
      responses:
        '200':
          description: Flux XML du sitemap
          content:
            application/xml:
              schema: {type: string}

  # =========================================================================
  # 2. ESPACE CLIENT (v2)
  # =========================================================================

  /client/auth/activate:
    post:
      operationId: activateClientAccount
      tags: [client]
      summary: Activation de compte client via invitation signée (EF-401)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, format: password, minLength: 14}
                mfa_activate: {type: boolean, default: false}
      responses:
        '200': {description: 'Compte activé, session créée'}
        '410': {$ref: '#/components/responses/Eproblem'}

  /client/auth/login:
    post:
      operationId: clientLogin
      tags: [client]
      summary: Connexion espace client (EF-402)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                totp_code: {type: string}
      responses:
        '200': {description: 'Session créée ou mfa_required'}
        '401': {$ref: '#/components/responses/Eproblem'}

  /client/documents:
    get:
      operationId: listClientDocuments
      tags: [client]
      summary: Documents du compte client connecté (EF-403)
      responses:
        '200':
          description: Liste des documents
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ClientDocument'}
        '401': {$ref: '#/components/responses/Eproblem'}

  /client/documents/{id}/download:
    get:
      operationId: downloadClientDocument
      tags: [client]
      summary: Téléchargement sécurisé d'un document client (EF-403)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Flux du document
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}

  # =========================================================================
  # 3. BACK-OFFICE (ADMIN)
  # =========================================================================

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Connexion back-office (Argon2id + TOTP, EF-501, ENF-301)
      description: |
        Première étape : e-mail + mot de passe.
        Si le compte a le MFA activé et qu'`totp_code` est absent ou invalide
        après mot de passe correct : `200` avec `status=mfa_required`
        (aucun cookie de session). Le client réessaie avec le même payload
        plus `totp_code`.
        Succès : `200` `status=authenticated`, cookies `session_id` (HttpOnly)
        et `csrf_token` (lisible), corps `{ user, csrf_token }`.
        Identifiants invalides : `401` `UNAUTHENTICATED` (message identique,
        anti-énumération). Trop de tentatives : `429` `RATE_LIMITED` avec
        `Retry-After`. Session idle expirée côté client : redirection login
        après `401` `SESSION_EXPIRED` sur les routes suivantes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminLoginRequest'}
      responses:
        '200':
          description: Session créée ou MFA requis
          headers:
            Set-Cookie:
              description: |
                En cas de `status=authenticated` uniquement :
                `session_id` (HttpOnly) et `csrf_token` (non-HttpOnly).
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLoginResponse'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}
        '429':
          description: Verrouillage / rate limit (page 09 §2.2)
          headers:
            Retry-After:
              schema: {type: integer}
              description: Secondes avant nouvel essai
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Déconnexion (révocation de la session courante)
      description: Exige cookie `session_id` et en-tête `X-CSRF-Token`.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '204': {description: Session révoquée, cookies effacés}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/me:
    get:
      operationId: adminMe
      tags: [admin-auth]
      summary: Session courante, permissions et jeton CSRF
      security:
        - SessionCookie: []
      description: |
        Source de vérité UI pour le RBAC (masquer n'est pas autoriser).
        Réémet `csrf_token` (cookie + corps) pour les SPA qui relisent
        le cookie après un rechargement.
      responses:
        '200':
          description: Utilisateur authentifié
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMeResponse'}
        '401': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/password-forgot:
    post:
      operationId: adminPasswordForgot
      tags: [admin-auth]
      summary: Demande de réinitialisation (lien signé, 1 h, usage unique)
      description: |
        Toujours `202`, même si l'e-mail est inconnu (anti-énumération, page 09).
        Aucun cookie. Le mail n'est envoyé que si le compte existe et est actif.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordForgotRequest'}
      responses:
        '202':
          description: Demande acceptée (aucune indication d'existence du compte)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [accepted]}
        '422': {$ref: '#/components/responses/Eproblem'}
        '429': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/password-reset:
    post:
      operationId: adminPasswordReset
      tags: [admin-auth]
      summary: Pose un nouveau mot de passe via le jeton du lien signé
      description: Révoque les sessions existantes du compte (page 09 §2.2).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordResetRequest'}
      responses:
        '204': {description: Mot de passe mis à jour}
        '410':
          description: Jeton expiré, déjà utilisé ou invalide (`TOKEN_EXPIRED`)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/password-change:
    post:
      operationId: adminPasswordChange
      tags: [admin-auth]
      summary: Changement de mot de passe (session active, dont must_reset_password)
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordChangeRequest'}
      responses:
        '204': {description: Mot de passe mis à jour}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/auth/activate:
    post:
      operationId: adminActivateAccount
      tags: [admin-auth]
      summary: Activation par invitation (fondateur Q-105 et utilisateurs invités)
      description: |
        Compte créé avec `password_hash=NULL` et `must_reset_password=true`.
        Le lien signé (TTL 7 jours, usage unique) permet de définir le mot
        de passe (min. 14). Succès : session + cookies CSRF comme au login.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminActivateRequest'}
      responses:
        '200':
          description: Compte activé, session créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminLoginAuthenticated'}
        '410':
          description: Invitation expirée, déjà utilisée ou invalide (`TOKEN_EXPIRED`)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Eproblem'}

  /admin/reports/dashboard:
    get:
      operationId: adminDashboard
      tags: [admin-reports]
      summary: Agrégats du tableau de bord (EF-512)
      description: Widgets leads, publications, contenus non publiés, dernier build, audit récent, complétude i18n.
      x-permission: [audit, view, default]
      responses:
        '200':
          description: Agrégats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDashboard'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/publication-jobs:
    get:
      operationId: adminListPublicationJobs
      tags: [admin-publication]
      summary: Historique des jobs de publication SSG
      x-permission: [pages, view, default]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
        - name: offset
          in: query
          schema: {type: integer, default: 0, minimum: 0}
      responses:
        '200':
          description: Liste paginée (offset, tables d'admin stables)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationJobList'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
    post:
      operationId: adminTriggerPublication
      tags: [admin-publication]
      summary: Déclenche un job de publication (bouton Publier)
      x-permission: [pages, publish, default]
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '202':
          description: Job accepté
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationJob'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '409':
          description: Un job `queued` ou `building` existe déjà (`CONFLICT`)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /admin/publication-jobs/current:
    get:
      operationId: adminCurrentPublicationJob
      tags: [admin-publication]
      summary: État courant du site public et dernier/actuel job
      description: |
        Alimente l'indicateur navbar : `up_to_date` | `pending_changes` |
        `building` | `failed`.
      x-permission: [pages, view, default]
      responses:
        '200':
          description: État de publication
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicationSiteStatus'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/publication-status:
    get:
      operationId: adminPublicationStatusStream
      tags: [admin-publication]
      summary: Flux SSE des jobs de publication (page 17)
      description: |
        `Content-Type: text/event-stream`. Cookie `session_id` requis.
        GET : pas d'en-tête CSRF.

        Format fil de fer (champs SSE standard) :

        ```
        id: <uuid-job-ou-seq>
        event: publication.job
        data: <JSON PublicationJob>

        event: heartbeat
        data: {"ts":"2026-10-31T19:00:00Z"}
        ```

        `event` vaut `publication.job` (changement d'état) ou `heartbeat`
        (toutes les 15 s, pour garder le proxy). `retry` conseillé : 3000.
        Le JSON `data` d'un `publication.job` valide `PublicationJob`.
      x-permission: [pages, view, default]
      responses:
        '200':
          description: Flux ouvert (trames SSE `event` + `data` JSON)
          content:
            text/event-stream:
              schema:
                type: string
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/notifications:
    get:
      operationId: adminListNotifications
      tags: [admin-notifications]
      summary: Notifications in-app (nouveaux leads)
      x-permission: [leads, view, default]
      parameters:
        - name: unread_only
          in: query
          schema: {type: boolean, default: false}
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminNotificationList'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}

  /admin/notifications/{id}/read:
    post:
      operationId: adminMarkNotificationRead
      tags: [admin-notifications]
      summary: Marque une notification comme lue
      x-permission: [leads, view, default]
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Marquée lue}
        '401': {$ref: '#/components/responses/Eproblem'}
        '403': {$ref: '#/components/responses/Eproblem'}
        '404': {$ref: '#/components/responses/Eproblem'}

  /admin/search:
    get:
      operationId: adminSearch
      tags: [admin-search]
      summary: Recherche admin (à venir — non implémenté en v1)
      description: |
        **À venir.** La recherche plein texte du back-office n'est pas
        au périmètre v1. L'UI expose une palette (Ctrl/Cmd+K) limitée aux
        entrées de navigation, plus un état « recherche de contenu bientôt
        disponible ». Cet endpoint est tracé pour ne pas inventer un contrat
        parallèle. Réponse v1 : `200` avec `status=not_implemented` et
        `results: []` (pas de 501, pour rester consommable par le client typé).
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: lang
          in: query
          schema: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
      responses:
        '200':
          description: Stub v1 — recherche de contenu non disponible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSearchResponse'}
        '401': {$ref: '#/components/responses/Eproblem'}
        '422': {$ref: '#/components/responses/Eproblem'}

