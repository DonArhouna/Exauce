# =========================================================================
# 4. COMPOSANTS (PARAMÈTRES, RÉPONSES, SCHÉMAS)
# =========================================================================

components:
  parameters:
    csrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        Nom figé. Doit égaler la valeur du cookie `csrf_token`.
        Obligatoire sur les mutations `/admin/**` (sauf login, forgot, reset, activate).
      schema: {type: string, minLength: 16}
    lang:
      name: lang
      in: query
      description: BCP-47 (fr, en)
      schema: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
    allLangs:
      name: all_langs
      in: query
      schema: {type: boolean, default: false}
    ifNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: Cookie de session HttpOnly. Nom figé.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: En-tête CSRF. Nom figé. Valeur = cookie csrf_token.

  responses:
    Eproblem:
      description: RFC 7807 (problem+json)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
        db: {type: string, enum: [up, down]}

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code:
          type: string
          description: Code d'erreur stable
          enum:
            - VALIDATION_ERROR
            - UNKNOWN_LANG
            - CONTENT_NOT_FOUND
            - REDIRECTED
            - UNAUTHENTICATED
            - SESSION_EXPIRED
            - MFA_REQUIRED
            - FORBIDDEN
            - CSRF_TOKEN_MISSING
            - CSRF_TOKEN_MISMATCH
            - NOT_PERMITTED_LANG
            - INVALID_TRANSITION
            - CONFLICT
            - RATE_LIMITED
            - IDEMPOTENT_REPLAY_CONFLICT
            - UPLOAD_REJECTED
            - IDOR_BLOCKED
            - TOKEN_EXPIRED
            - NOT_IMPLEMENTED
            - SERVER_ERROR
        detail: {type: string}
        correlation_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}

    Localized:
      type: object
      description: Valeur localisée avec statut de repli explicite
      properties:
        value: {type: string}
        is_fallback: {type: boolean}

    SearchHit:
      type: object
      properties:
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        title: {type: string}
        slug: {type: string}
        href: {type: string}
        rank: {type: number}
        is_fallback: {type: boolean}

    Language:
      type: object
      properties:
        code: {type: string, maxLength: 10}
        label: {type: string}
        direction: {type: string, enum: [ltr, rtl]}
        is_default: {type: boolean}

    ServicesTree:
      type: object
      properties:
        lang: {type: string}
        default_lang: {type: string}
        alternate:
          type: object
          additionalProperties: {type: string}
        fallback:
          type: object
          nullable: true
        families:
          type: array
          items: {$ref: '#/components/schemas/Family'}

    Family:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        tagline: {type: string, nullable: true}
        is_fallback: {type: boolean}
        domains:
          type: array
          items: {$ref: '#/components/schemas/Domain'}

    Domain:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        intro: {type: string, nullable: true}
        is_fallback: {type: boolean}
        groups:
          type: array
          items: {$ref: '#/components/schemas/Group'}

    Group:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        is_fallback: {type: boolean}
        services:
          type: array
          items: {$ref: '#/components/schemas/PrestationItem'}

    PrestationItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        is_fallback: {type: boolean}

    DomainDetail:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        intro: {$ref: '#/components/schemas/Localized'}
        prev:
          type: object
          nullable: true
          properties:
            slug: {type: string}
            title: {type: string}
        next:
          type: object
          nullable: true
          properties:
            slug: {type: string}
            title: {type: string}
        groups:
          type: array
          items: {$ref: '#/components/schemas/Group'}

    Sector:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        kind: {type: string, enum: [sector, subcategory]}
        slug: {type: string}
        title: {type: string}
        intro: {type: string, nullable: true}
        approved: {type: boolean}
        subcategories:
          type: array
          items: {$ref: '#/components/schemas/Sector'}

    SectorUpsert:
      type: object
      required: [code, kind]
      properties:
        code: {type: string}
        kind: {type: string, enum: [sector, subcategory]}
        parent_id: {type: string, format: uuid, nullable: true}
        position: {type: integer}
        approved: {type: boolean}

    InterventionType:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        slug: {type: string}
        title: {type: string}
        intro: {type: string}
        signature: {type: string}
        sort_order: {type: integer}

    Office:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        is_headquarters: {type: boolean}
        is_active: {type: boolean}
        phone_fixed: {type: string, nullable: true}
        phone_mobile: {type: string, nullable: true}
        email: {type: string, nullable: true}
        map_url: {type: string, nullable: true}
        name: {type: string}
        address_lines:
          type: array
          items: {type: string}
        city: {type: string}

    OfficeUpsert:
      type: object
      required: [code]
      properties:
        code: {type: string}
        is_headquarters: {type: boolean}
        is_active: {type: boolean}
        position: {type: integer}
        phone_fixed: {type: string, nullable: true}
        phone_mobile: {type: string, nullable: true}
        email: {type: string, nullable: true}
        map_url: {type: string, nullable: true}
        media_id: {type: string, format: uuid, nullable: true}

    TeamMember:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        is_founder: {type: boolean}
        is_active: {type: boolean}
        full_name: {type: string}
        role: {type: string}
        bio: {type: string, nullable: true}
        photo_url: {type: string, nullable: true}
        email: {type: string, nullable: true}
        linkedin_url: {type: string, nullable: true}

    TeamMemberUpsert:
      type: object
      required: [code]
      properties:
        code: {type: string}
        is_founder: {type: boolean}
        is_active: {type: boolean}
        position: {type: integer}
        media_id: {type: string, format: uuid, nullable: true}
        email: {type: string, nullable: true}
        linkedin_url: {type: string, nullable: true}

    PublicationSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        excerpt: {type: string, nullable: true}
        category_code: {type: string}
        published_at: {type: string, format: date-time}
        cover_url: {type: string, nullable: true}
        is_fallback: {type: boolean}

    PublicationDetail:
      allOf:
        - $ref: '#/components/schemas/PublicationSummary'
        - type: object
          properties:
            body: {$ref: '#/components/schemas/Localized'}
            author_name: {type: string, nullable: true}

    PageSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        page_key: {type: string}
        template: {type: string}
        is_in_nav: {type: boolean}
        nav_position: {type: integer, nullable: true}
        is_system: {type: boolean}
        status: {type: string}

    PageDetail:
      type: object
      properties:
        id: {type: string, format: uuid}
        page_key: {type: string}
        template: {type: string}
        is_in_nav: {type: boolean}
        nav_position: {type: integer, nullable: true}
        is_system: {type: boolean}
        status: {type: string}
        banners_pending: {type: boolean}
        title: {$ref: '#/components/schemas/Localized'}
        sections:
          type: array
          items: {$ref: '#/components/schemas/Section'}

    Section:
      type: object
      properties:
        id: {type: string, format: uuid}
        section_type: {type: string}
        source_key: {type: string, nullable: true}
        position: {type: integer}
        is_active: {type: boolean}
        config: {type: object}
        data:
          type: object
          description: Données traduites de la section (hero, stats, CTA...)

    SectionUpsert:
      type: object
      required: [section_type, position]
      properties:
        section_type: {type: string}
        source_key: {type: string, nullable: true}
        position: {type: integer}
        is_active: {type: boolean, default: true}
        config: {type: object}

    PublicSettings:
      type: object
      description: Coordonnées et SEO publics (EF-106)
      properties:
        legal_name: {type: string}
        tagline: {type: string}
        email: {type: string, format: email}
        phone_fixed: {type: string}
        phone_mobile: {type: string}
        city: {type: string}
        address: {type: string, nullable: true}
        socials:
          type: object
          additionalProperties: {type: string}
        seo_default:
          type: object
          properties:
            og_image: {type: string}
            robots: {type: string}

    SiteSettingGroup:
      type: object
      properties:
        group_key: {type: string}
        settings:
          type: object
          additionalProperties: true

    MediaItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [image, pdf, document]}
        storage_key: {type: string}
        url: {type: string}
        mime: {type: string}
        size_bytes: {type: integer}
        status: {type: string, enum: [active, replaced, deleted]}
        alt: {type: string, nullable: true}
        caption: {type: string, nullable: true}
        created_at: {type: string, format: date-time}

    ContentVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        lang: {type: string}
        version_num: {type: integer}
        author_name: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        data: {type: object}

    RedirectItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        old_path: {type: string}
        target_path: {type: string}
        status_code: {type: integer, enum: [301, 302]}
        auto_generated: {type: boolean}
        created_at: {type: string, format: date-time}

    RedirectCreate:
      type: object
      required: [old_path, target_path]
      properties:
        old_path: {type: string}
        target_path: {type: string}
        status_code: {type: integer, enum: [301, 302], default: 301}

    AdminUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        is_active: {type: boolean}
        default_lang: {type: string}
        must_reset_password: {type: boolean}
        mfa_enabled: {type: boolean}
        roles:
          type: array
          items: {type: string}
        last_login_at: {type: string, format: date-time, nullable: true}

    AdminUserCreate:
      type: object
      required: [email, display_name]
      description: |
        Mot de passe optionnel. S'il est omis, le Backend envoie une
        invitation signée (Q-105 / EF-513) ; le compte naît avec
        `password_hash=NULL` et `must_reset_password=true`.
        S'il est fourni, longueur minimale 14 (page 09).
      properties:
        email: {type: string, format: email}
        password:
          type: string
          format: password
          minLength: 14
          description: Optionnel. Absent → invitation, pas de mot de passe initial.
        display_name: {type: string}
        default_lang: {type: string, default: fr}
        send_invitation:
          type: boolean
          default: true
          description: Ignoré si `password` est fourni et que l'invitation n'est pas souhaitée.
        role_codes:
          type: array
          items: {type: string}

    AdminUserUpdate:
      type: object
      properties:
        display_name: {type: string}
        default_lang: {type: string}
        role_codes:
          type: array
          items: {type: string}

    Role:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        label: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}

    Permission:
      type: object
      properties:
        id: {type: string, format: uuid}
        module: {type: string}
        action: {type: string}
        lang: {type: string, nullable: true}

    LeadDetail:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        subject: {type: string}
        message: {type: string}
        lang: {type: string}
        status: {type: string, enum: [new, in_progress, waiting, done, rejected, anonymized]}
        assigned_to: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        notes:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              author_name: {type: string}
              note: {type: string}
              created_at: {type: string, format: date-time}

    LeadStatusUpdate:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [new, in_progress, waiting, done, rejected, anonymized]}
        note: {type: string}

    LeadNoteCreate:
      type: object
      required: [note]
      properties:
        note: {type: string}
        internal: {type: boolean, default: true}

    AuditEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        actor_type: {type: string, enum: [user, system]}
        actor_name: {type: string, nullable: true}
        action: {type: string}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid, nullable: true}
        ip: {type: string, nullable: true}

    ContactRequest:
      type: object
      required: [name, email, subject, message]
      properties:
        name: {type: string, maxLength: 120}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        subject: {type: string, maxLength: 200}
        message: {type: string, maxLength: 5000}
        lang: {type: string}
        honeypot: {type: string, description: Doit rester vide (chasse au bot)}
        elapsed_ms: {type: integer, description: Délai de rédaction (anti-bot)}

    ClientDocument:
      type: object
      properties:
        id: {type: string, format: uuid}
        original_name: {type: string}
        mime: {type: string}
        size_bytes: {type: integer}
        created_at: {type: string, format: date-time}

    NodeUpsert:
      type: object
      required: [node_type]
      properties:
        node_type: {type: string, enum: [family, domain, group, service]}
        parent_id: {type: string, format: uuid, nullable: true}
        position: {type: integer}

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 1}
        totp_code:
          type: string
          minLength: 6
          maxLength: 8
          description: Code TOTP. Requis au second essai si `status=mfa_required`.

    AdminLoginAuthenticated:
      type: object
      required: [status, user, csrf_token]
      properties:
        status: {type: string, enum: [authenticated]}
        user: {$ref: '#/components/schemas/AdminSessionUser'}
        csrf_token:
          type: string
          description: Même valeur que le cookie `csrf_token` (non-HttpOnly).

    AdminLoginMfaRequired:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [mfa_required]}

    AdminLoginResponse:
      description: |
        Discriminateur `status`. `authenticated` pose les cookies `session_id`
        et `csrf_token`. `mfa_required` n'en pose aucun ; le client renvoie
        le même login avec `totp_code`.
      oneOf:
        - $ref: '#/components/schemas/AdminLoginAuthenticated'
        - $ref: '#/components/schemas/AdminLoginMfaRequired'

    AdminSessionUser:
      type: object
      required: [id, email, display_name, is_active, must_reset_password, permissions]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        is_active: {type: boolean}
        default_lang: {type: string}
        must_reset_password: {type: boolean}
        mfa_enabled: {type: boolean}
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}

    AdminMeResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user: {$ref: '#/components/schemas/AdminSessionUser'}
        csrf_token: {type: string}

    AdminPasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}

    AdminPasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, format: password, minLength: 14}

    AdminPasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, format: password, minLength: 14}

    AdminActivateRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, format: password, minLength: 14}
        totp_code:
          type: string
          description: Optionnel. Enrôlement TOTP si le rôle l'exige et qu'un secret a été scanné hors bande.

    LeadSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        subject: {type: string}
        status: {type: string, enum: [new, in_progress, waiting, done, rejected, anonymized]}
        created_at: {type: string, format: date-time}

    AdminDashboard:
      type: object
      required: [leads, publications, content, publication, i18n, audit]
      properties:
        generated_at: {type: string, format: date-time}
        leads:
          type: object
          required: [new_count, recent]
          properties:
            new_count: {type: integer, minimum: 0}
            recent:
              type: array
              items: {$ref: '#/components/schemas/LeadSummary'}
        publications:
          type: object
          required: [draft_count, in_review_count]
          properties:
            draft_count: {type: integer, minimum: 0}
            in_review_count: {type: integer, minimum: 0}
        content:
          type: object
          required: [unpublished_changes_count]
          properties:
            unpublished_changes_count:
              type: integer
              minimum: 0
              description: Entités éditoriales modifiées plus récentes que le dernier job `success`.
        publication: {$ref: '#/components/schemas/PublicationSiteStatus'}
        i18n:
          type: object
          required: [completeness_pct, missing_count]
          properties:
            completeness_pct: {type: number, minimum: 0, maximum: 100}
            missing_count: {type: integer, minimum: 0}
        audit:
          type: object
          required: [recent]
          properties:
            recent:
              type: array
              items: {$ref: '#/components/schemas/AuditEntry'}

    PublicationJob:
      type: object
      required: [id, status, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, building, success, failed]}
        triggered_by_name: {type: string, nullable: true}
        step: {type: string, nullable: true}
        step_index: {type: integer, nullable: true}
        step_total: {type: integer, nullable: true}
        log_output: {type: string, nullable: true}
        error_summary: {type: string, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    PublicationJobList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicationJob'}
        total: {type: integer}

    PublicationSiteStatus:
      type: object
      required: [site_status]
      properties:
        site_status:
          type: string
          enum: [up_to_date, pending_changes, building, failed]
        current_job:
          oneOf:
            - $ref: '#/components/schemas/PublicationJob'
            - type: 'null'
        last_success_at: {type: string, format: date-time, nullable: true}

    AdminNotification:
      type: object
      required: [id, kind, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [lead_new]}
        title: {type: string}
        lead_id: {type: string, format: uuid, nullable: true}
        read_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    AdminNotificationList:
      type: object
      required: [items, unread_count]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminNotification'}
        unread_count: {type: integer, minimum: 0}

    AdminSearchResponse:
      type: object
      required: [status, results]
      description: Stub v1. Une version ultérieure pourra renvoyer `ok` et des `SearchHit`.
      properties:
        status: {type: string, enum: [not_implemented]}
        results:
          type: array
          maxItems: 0
          items: {$ref: '#/components/schemas/SearchHit'}
